<template id="countdown-template">
  <div class="countdown-scene" data-composition-id="countdown" data-width="1920" data-height="1080">
    <style>
      .countdown-scene {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
        background-color: var(--color-bg-base);
      }

      .countdown-circle {
        position: relative;
        width: 400px;
        height: 400px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .ring {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 8px solid var(--color-brand);
        opacity: 0;
      }

      .ring-inner {
        border: 4px solid var(--color-text-main);
        transform: scale(0.85);
        opacity: 0.2;
      }

      .number-container {
        position: relative;
        z-index: 10;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .count-number {
        position: absolute;
        font-size: 220px;
        font-weight: 900;
        color: var(--color-text-main);
        opacity: 0;
      }
    </style>

    <div class="countdown-circle">
      <div id="ring-1-comp" class="ring"></div>
      <div id="ring-2-comp" class="ring ring-inner"></div>

      <div class="number-container" id="numbers-wrapper-comp">
        <!-- Numbers generated via JS based on countdownStart -->
      </div>
    </div>

    <script>
      (() => {
        // Embed animator script inline to avoid race conditions
        function createCountdownAnimation(tl, wrapperId, startNum, duration) {
          const timePerNum = duration / startNum;
          const wrapper = document.getElementById(wrapperId) || document.querySelector(".number-container");

          if (!wrapper) return;

          const ring1 = document.getElementById("ring-1-comp") || document.querySelectorAll(".ring")[0];

          for (let i = startNum; i > 0; i--) {
            const el = document.createElement("div");
            el.className = "count-number";
            const numId = `count-num-${i}-comp`;
            el.id = numId;
            el.textContent = i;
            wrapper.appendChild(el);

            const startTime = (startNum - i) * timePerNum;

            tl.fromTo(el,
              { scale: 0.5, opacity: 0 },
              { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.5)" },
              startTime
            );

            tl.to(el,
              { scale: 1.5, opacity: 0, duration: 0.4, ease: "power2.in" },
              startTime + timePerNum - 0.4
            );

            tl.fromTo(ring1,
              { scale: 0.8, opacity: 0.8, borderWidth: "16px", filter: "drop-shadow(0 0 10px var(--color-brand))" },
              { scale: 1.4, opacity: 0, borderWidth: "0px", filter: "drop-shadow(0 0 40px var(--color-brand))", duration: timePerNum, ease: "power2.out" },
              startTime
            );
          }
        }

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        const startNum = window.__vars ? window.__vars.countdownStart : 3;
        const duration = window.__vars ? window.__vars.durationCountdown : 4;

        createCountdownAnimation(tl, "numbers-wrapper-comp", startNum, duration);

        const ring2 = document.getElementById("ring-2-comp") || document.querySelectorAll(".ring")[1];

        tl.to(ring2, { opacity: 0.4, duration: 0.5, overwrite: "auto" }, 0);
        tl.to(ring2, { rotation: 180, duration: duration, ease: "none" }, 0);
        tl.to(ring2, { opacity: 0, duration: 0.5, overwrite: "auto" }, duration - 0.5);

        window.__timelines["countdown"] = tl;
      })();
    </script>
  </div>
</template>
