<!DOCTYPE html>
<div
  id="header"
  data-composition-id="header" data-width="1080" data-height="1920"
  data-start="0"
  data-duration="10"
  class="flex flex-col items-center justify-center w-full text-center px-8"
>
  <div id="header-subtitle" class="clip text-2xl font-bold uppercase tracking-widest mb-4 opacity-80" data-start="0.5" data-duration="9.5" data-track-index="1"></div>
  <div id="header-title" class="clip text-6xl font-extrabold leading-tight tracking-tight" data-start="0.5" data-duration="9.5" data-track-index="2"></div>
</div>

<script>
  (function() {
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    const titleEl = document.getElementById('header-title');
    const subtitleEl = document.getElementById('header-subtitle');

    titleEl.textContent = window.__vars.content.title;
    titleEl.style.color = window.__vars.theme.textColor;

    subtitleEl.textContent = window.__vars.content.subtitle;
    subtitleEl.style.color = window.__vars.theme.accentColor;

    // Enter
    tl.from(subtitleEl, { y: -30, opacity: 0, duration: 0.8, ease: "back.out(1.7)" }, 0.5);
    tl.from(titleEl, { y: 30, opacity: 0, duration: 0.8, ease: "power3.out" }, 0.7);

    // Hard kill
    tl.set(subtitleEl, { opacity: 0 }, 10);
    tl.set(titleEl, { opacity: 0 }, 10);

    window.__timelines["header"] = tl;
  })();
</script>
