<template id="background-template">
  <div data-composition-id="background" data-width="1920" data-height="1080">
    <div id="bg-decor" class="absolute top-0 right-0 w-[800px] h-[800px] opacity-5 rounded-full blur-3xl -translate-y-1/2 translate-x-1/4"></div>

    <style>
      #background {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-color: var(--vars-bg-primary, #fdfdfd);
        overflow: hidden;
      }
      #background #bg-decor {
        background-color: var(--vars-accent, #ef4444);
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function() {
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        const v = window.__vars || { totalDuration: 15 };

        // Ambient background movement
        tl.to("#bg-decor", {
          scale: 1.2,
          x: "+=50",
          y: "+=50",
          duration: v.totalDuration,
          ease: "sine.inOut"
        }, 0);

        window.__timelines["background"] = tl;
      })();
    </script>
  </div>
</template>
