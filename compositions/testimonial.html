<!doctype html>
<html>
  <body>
    <div data-composition-id="testimonial-sub" data-start="0" data-duration="10" data-width="1920" data-height="1080" class="flex items-center justify-center h-full w-full">
      <!-- Dynamic variables applied in script -->
      <div id="bg" class="absolute inset-0 z-0"></div>

      <div id="card" class="relative z-10 w-[1200px] bg-white rounded-3xl shadow-2xl p-16 flex flex-col justify-between opacity-0 translate-y-12">
        <!-- Quote icon -->
        <div class="mb-8">
          <svg id="quote-icon" width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 11H6C6 8.23858 8.23858 6 11 6V4C7.13401 4 4 7.13401 4 11V19H10V11ZM20 11H16C16 8.23858 18.238 6 21 6V4C17.134 4 14 7.13401 14 11V19H20V11Z" fill="currentColor"/>
          </svg>
        </div>

        <!-- Quote Text -->
        <p id="quote-text" class="text-5xl font-medium leading-tight mb-12 text-balance"></p>

        <!-- Stars Rating -->
        <div id="stars-container" class="flex gap-2 mb-8 h-10"></div>

        <!-- Customer Info -->
        <div class="flex items-center gap-6 mt-auto pt-8 border-t border-gray-100">
          <div id="customer-avatar" class="w-24 h-24 rounded-full shadow-sm opacity-0 scale-75 bg-gray-200 flex items-center justify-center text-gray-900 text-3xl font-bold"></div>
          <div class="flex flex-col opacity-0 translate-x-4" id="customer-details">
            <h3 id="customer-name" class="text-3xl font-bold"></h3>
            <p id="customer-title" class="text-xl text-gray-500 mt-1"></p>
          </div>
        </div>
      </div>

      <script>
        const vars = window.__vars || (window.__hyperframes ? window.__hyperframes.getVariables() : {});

        // Apply variables
        document.getElementById("bg").style.backgroundColor = vars.backgroundColor || "#f3f4f6";
        document.getElementById("card").style.color = vars.textColor || "#1f2937";
        document.getElementById("quote-icon").style.color = vars.primaryColor || "#3b82f6";
        document.getElementById("quote-text").textContent = vars.quoteText || "\"This product completely transformed how we work.\"";

        const cName = vars.customerName || "Jane Doe";
        document.getElementById("customer-name").textContent = cName;
        document.getElementById("customer-title").textContent = vars.customerTitle || "Product Manager, TechCorp";

        // Use initials for avatar since external network calls are forbidden
        const initials = cName.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
        document.getElementById("customer-avatar").textContent = initials;
        document.getElementById("customer-avatar").style.backgroundColor = vars.primaryColor || "#3b82f6";
        // To ensure good contrast for the initials, we'll force the text to be a deep dark color.
        document.getElementById("customer-avatar").style.color = "#111827";

        // Generate stars
        const starsContainer = document.getElementById("stars-container");
        const rating = vars.rating || 5;
        for (let i = 0; i < 5; i++) {
          const star = document.createElement("div");
          star.className = "star opacity-0 scale-50";
          star.innerHTML = `<svg width="40" height="40" viewBox="0 0 24 24" fill="${i < rating ? (vars.primaryColor || '#3b82f6') : '#e5e7eb'}" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" />
          </svg>`;
          starsContainer.appendChild(star);
        }

        // Timeline
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        tl.to("#card", { opacity: 1, y: 0, duration: 1, ease: "power3.out" }, 0.5)
          .to(".star", { opacity: 1, scale: 1, duration: 0.5, stagger: 0.1, ease: "back.out(1.7)" }, 1.0)
          .to("#customer-avatar", { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.5)" }, 1.5)
          .to("#customer-details", { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 1.7);

        window.__timelines["testimonial-sub"] = tl;
      </script>
    </div>
  </body>
</html>
