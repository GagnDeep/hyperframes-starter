<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
    </style>
  </head>
  <body>
    <div
      id="intro-root"
      data-composition-id="intro"
      data-start="0"
      data-duration="5"
      data-width="1080"
      data-height="1920"
      class="w-full h-full flex flex-col items-center justify-center relative font-sans"
    >
      <!-- Background elements for visual flair -->
      <div id="intro-bg-circle" class="absolute w-[800px] h-[800px] rounded-full blur-[120px] opacity-30 z-0"></div>

      <!-- Main Content -->
      <div class="z-10 flex flex-col items-center gap-12">
        <div id="logo-container" class="w-48 h-48 rounded-3xl bg-white/10 backdrop-blur-md flex items-center justify-center shadow-2xl border border-white/20 p-8 overflow-visible">
          <img id="brand-logo" src="" alt="Logo" class="w-full h-full object-contain filter invert opacity-90" />
        </div>

        <div class="text-center mt-8 overflow-visible">
          <h1 data-layout-allow-overflow="true" id="intro-heading" class="text-8xl font-black tracking-tighter uppercase drop-shadow-xl" style="line-height: 1.1;"></h1>
        </div>

        <div class="overflow-visible mt-4">
          <p id="intro-subheading" class="text-4xl font-medium tracking-wide opacity-80"></p>
        </div>
      </div>
    </div>

    <script>
      // Load variables
      const vars = window.parent.__vars || window.__vars || {
        productName: "Product",
        tagline: "Tagline",
        primaryColor: "#3b82f6",
        logoUrl: ""
      };

      if (window.__hyperframes && typeof window.__hyperframes.getVariables === 'function') {
         Object.assign(vars, window.__hyperframes.getVariables());
      }

      // Apply data
      document.getElementById('brand-logo').src = vars.logoUrl;
      document.getElementById('intro-heading').textContent = "Introducing";
      document.getElementById('intro-subheading').textContent = vars.productName;
      document.getElementById('intro-bg-circle').style.backgroundColor = vars.primaryColor;
      document.getElementById('intro-heading').style.color = "#ffffff";

      // GSAP Animation
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Initial state
      gsap.set("#intro-bg-circle", { scale: 0.1, opacity: 0 });
      gsap.set("#logo-container", { scale: 0.8, opacity: 0, y: 100, rotationX: 45 });
      gsap.set("#intro-heading", { y: 100, opacity: 0 });
      gsap.set("#intro-subheading", { y: 50, opacity: 0 });

      // Build sequence
      tl.to("#intro-bg-circle", {
        scale: 1,
        opacity: 0.8,
        duration: 2,
        ease: "power3.out"
      }, 0)
      .to("#logo-container", {
        scale: 1,
        opacity: 1,
        y: 0,
        rotationX: 0,
        duration: 1.2,
        ease: "back.out(1.5)"
      }, 0.2)
      .to("#intro-heading", {
        y: 0,
        opacity: 1,
        duration: 1,
        ease: "power4.out"
      }, 0.6)
      .to("#intro-subheading", {
        y: 0,
        opacity: 1,
        duration: 1,
        ease: "power3.out"
      }, 0.8)
      // Exit animations
      .to("#intro-root > .z-10", {
        scale: 1.1,
        opacity: 0,
        stagger: 0.1,
        duration: 0.8,
        ease: "power2.inOut"
      }, 4.0);

      window.parent.__timelines = window.parent.__timelines || {}; window.__timelines["intro"] = tl;
    </script>
  </body>
</html>
