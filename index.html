<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script>
      // Single config object for all customizable values
      window.__vars = {
        bgColor: "#0f172a", // Tailwind slate-900
        accentColor: "#38bdf8", // Tailwind sky-400
        textColor: "#ffffff",
        fontFamily: "Inter, sans-serif",
        duration: 10,
        captions: [
          { text: "STOP SCROLLING!", start: 0, end: 1.5 },
          { text: "Are you making", start: 1.5, end: 3 },
          { text: "this ONE mistake?", start: 3, end: 5 },
          { text: "Let's fix it", start: 5, end: 7 },
          { text: "right now.", start: 7, end: 10 }
        ]
      };
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="bg-comp"
        data-composition-id="background"
        data-composition-src="compositions/background.html"
        data-start="0"
        data-track-index="0"
      ></div>

      <div
        id="captions-comp"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-track-index="1"
      ></div>
    </div>

    <script>
      document.body.style.fontFamily = window.__vars.fontFamily;

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
