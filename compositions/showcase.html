<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }

      /* Image masking clip path */
      .img-mask {
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      }
    </style>
  </head>
  <body>
    <div
      id="showcase-root"
      data-composition-id="showcase"
      data-start="0"
      data-duration="6"
      data-width="1080"
      data-height="1920"
      class="w-full h-full flex flex-col justify-center relative font-sans px-16"
    >
      <!-- Split background -->
      <div id="showcase-bg-panel" class="absolute top-1/2 left-0 right-0 bottom-0 z-0 opacity-0 transform -skew-y-6"></div>

      <div class="z-10 w-full h-[900px] relative rounded-[40px] overflow-visible shadow-2xl img-mask border-4 border-white/10" id="product-container" class="z-10 w-full h-[900px] relative rounded-[40px] overflow-hidden shadow-2xl img-mask border-4 border-white/10">
        <img data-layout-allow-overflow="true" id="product-image" src="" alt="Product" class="w-full h-full object-cover origin-center" />

        <!-- Gradient overlay -->
        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>

        <!-- Inside image text -->
        <div class="absolute bottom-12 left-12 right-12">
          <div class="overflow-visible">
            <h2 id="product-name" class="text-7xl font-bold text-white mb-2 tracking-tight"></h2>
          </div>
          <div class="overflow-visible">
            <p id="product-tagline" class="text-3xl text-white"></p>
          </div>
        </div>
      </div>

      <div class="z-10 mt-16 flex justify-between items-end px-4 overflow-visible">
        <div id="feature-list" class="flex flex-col gap-6">
          <div class="feature-item flex items-center gap-4 opacity-0 transform translate-x-[-50px]">
            <div class="w-4 h-4 rounded-full feature-dot"></div>
            <span class="text-4xl font-semibold tracking-wide">Premium Build</span>
          </div>
          <div class="feature-item flex items-center gap-4 opacity-0 transform translate-x-[-50px]">
            <div class="w-4 h-4 rounded-full feature-dot"></div>
            <span class="text-4xl font-semibold tracking-wide">Next-Gen Tech</span>
          </div>
        </div>

        <div class="text-right flex flex-col items-end opacity-0" id="price-container">
          <span class="text-2xl text-white opacity-80 uppercase tracking-widest mb-2 font-bold">Only</span>
          <span id="product-price" class="text-8xl font-black drop-shadow-lg"></span>
        </div>
      </div>
    </div>

    <script>
      // Load variables
      const vars = window.parent.__vars || window.__vars || {
        productName: "Product",
        tagline: "Tagline",
        price: "$0",
        primaryColor: "#3b82f6",
        accentColor: "#10b981",
        productImage: ""
      };

      if (window.__hyperframes && typeof window.__hyperframes.getVariables === 'function') {
         Object.assign(vars, window.__hyperframes.getVariables());
      }

      // Apply data
      document.getElementById('product-image').src = vars.productImage;
      document.getElementById('product-name').textContent = vars.productName;
      document.getElementById('product-tagline').textContent = vars.tagline;
      document.getElementById('product-price').textContent = vars.price;

      document.getElementById('product-price').style.color = vars.accentColor;
      document.getElementById('showcase-bg-panel').style.backgroundColor = vars.primaryColor;
      document.getElementById('showcase-bg-panel').style.opacity = "0.15";

      document.querySelectorAll('.feature-dot').forEach(el => {
        el.style.backgroundColor = vars.accentColor;
      });

      // GSAP Animation
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Setup initial states manually to be safe, though GSAP `from` handles it mostly
      gsap.set("#product-container", { scale: 0.8, y: 150, opacity: 0, rotationX: 15 });
      gsap.set("#product-image", { scale: 1.4 });
      gsap.set("#product-name", { y: 100 });
      gsap.set("#product-tagline", { y: 100 });
      gsap.set("#showcase-bg-panel", { y: 500 });

      // Build sequence
      tl.to("#product-container", {
        scale: 1,
        y: 0,
        opacity: 1,
        rotationX: 0,
        duration: 1.5,
        ease: "power4.out"
      }, 0)
      .to("#product-image", {
        scale: 1,
        duration: 4,
        ease: "power2.out"
      }, 0)
      .to("#showcase-bg-panel", {
        y: 0,
        duration: 1.5,
        ease: "power3.out"
      }, 0.2)
      .to("#product-name", {
        y: 0,
        duration: 1,
        ease: "power4.out"
      }, 0.8)
      .to("#product-tagline", {
        y: 0,
        duration: 1,
        ease: "power4.out"
      }, 0.9)
      .to("#showcase-root .feature-item", {
        x: 0,
        opacity: 1,
        stagger: 0.15,
        duration: 0.8,
        ease: "back.out(1.2)"
      }, 1.2)
      .to("#price-container", {
        y: -20,
        opacity: 1,
        duration: 0.8,
        ease: "back.out(1.5)"
      }, 1.5)
      // Exit animations
      .to("#showcase-root", {
        opacity: 0,
        scale: 1.05,
        duration: 0.8,
        ease: "power2.inOut"
      }, 5.2);

      window.parent.__timelines = window.parent.__timelines || {}; window.__timelines["showcase"] = tl;
    </script>
  </body>
</html>
