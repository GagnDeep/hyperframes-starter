<div
  id="comp-announcement-root" data-composition-id="announcement" data-width="1080" data-height="1920"
  class="flex flex-col items-center justify-center h-full w-full relative"
>
  <!-- Decorative background elements -->
  <div id="decor-circle" class="clip absolute rounded-full opacity-20" data-start="0" data-duration="10" data-track-index="0" style="width: 800px; height: 800px; filter: blur(100px);"></div>

  <div class="z-10 flex flex-col items-center text-center px-12">
    <!-- Badge -->
    <div id="badge-container" class="clip overflow-hidden mb-8 rounded-full px-6 py-2" data-layout-allow-overflow data-start="0.5" data-duration="9.5" data-track-index="1">
      <p id="badge-text" class="text-2xl font-bold tracking-widest uppercase"></p>
    </div>

    <!-- Main Headline -->
    <div id="headline-container" class="clip mb-6" data-start="1" data-duration="9" data-track-index="2">
      <h1 id="headline-text" class="text-8xl font-black tracking-tighter uppercase" style="line-height: 1.1;"></h1>
    </div>

    <!-- Subheadline -->
    <div id="subheadline-container" class="clip mb-12" data-start="1.5" data-duration="8.5" data-track-index="3">
      <h2 id="subheadline-text" class="text-5xl font-medium tracking-tight"></h2>
    </div>

    <!-- Promo Code Box -->
    <div id="promo-box" class="clip mt-8 border-4 border-dashed rounded-xl px-10 py-6" data-start="2" data-duration="8" data-track-index="4">
      <p id="promo-text" class="text-4xl font-bold tracking-wider"></p>
    </div>
  </div>
</div>

<script>
  // Apply variables to elements
  document.getElementById('decor-circle').style.backgroundColor = window.__vars.theme.accentColor;

  const badgeContainer = document.getElementById('badge-container');
  badgeContainer.style.backgroundColor = window.__vars.theme.accentColor;
  badgeContainer.style.color = window.__vars.theme.backgroundColor;
  document.getElementById('badge-text').innerText = window.__vars.content.badgeText;

  const headlineText = document.getElementById('headline-text');
  headlineText.style.color = window.__vars.theme.textColorPrimary;
  headlineText.innerText = window.__vars.content.headline;

  const subheadlineText = document.getElementById('subheadline-text');
  subheadlineText.style.color = window.__vars.theme.textColorSecondary;
  subheadlineText.innerText = window.__vars.content.subheadline;

  const promoBox = document.getElementById('promo-box');
  promoBox.style.borderColor = window.__vars.theme.accentColor;
  promoBox.style.backgroundColor = `${window.__vars.theme.accentColor}10`; // slight tint
  const promoText = document.getElementById('promo-text');
  promoText.style.color = window.__vars.theme.accentColor;
  promoText.innerText = window.__vars.content.promoCode;

  // GSAP Animation
  const tl = gsap.timeline({ paused: true });

  // Decor
  tl.fromTo("#decor-circle",
    { scale: 0.5, opacity: 0 },
    { scale: 1.5, opacity: 0.3, duration: 4, ease: "power2.out" }, 0
  );

  // Badge
  tl.fromTo("#badge-container",
    { y: 50, opacity: 0 },
    { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, 0.5
  );

  // Headline
  tl.fromTo("#headline-text",
    { y: 150, opacity: 0 },
    { y: 0, opacity: 1, duration: 1, ease: "power4.out" }, 1
  );

  // Subheadline
  tl.fromTo("#subheadline-text",
    { y: 50, opacity: 0 },
    { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, 1.5
  );

  // Promo Code
  tl.fromTo("#promo-box",
    { scale: 0.8, opacity: 0 },
    { scale: 1, opacity: 1, duration: 0.8, ease: "back.out(1.2)" }, 2
  );

  // Exit animations
  tl.to(["#badge-container", "#headline-text", "#subheadline-text", "#promo-box"], {
    y: -50,
    opacity: 0,
    duration: 0.6,
    stagger: 0.1,
    ease: "power2.in"
  }, 9);

  // Deterministic cleanups for exiting elements
  tl.set(["#badge-container", "#headline-text", "#subheadline-text", "#promo-box"], { opacity: 0, visibility: 'hidden' }, 9.6);

  window.__timelines = window.__timelines || {};
  window.__timelines["announcement"] = tl;
</script>
