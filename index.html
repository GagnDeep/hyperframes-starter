<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      // HyperFrames Template Editable Variables
      window.__vars = {
        // Colors
        brandColorPrimary: "#00f2fe",
        brandColorSecondary: "#4facfe",
        backgroundColor: "#050505",
        textColor: "#ffffff",
        accentColor: "#fbbf24",

        // Texts
        teaserText: "The future of design",
        productName: "HyperFrames Pro",
        tagline: "Build stunning video templates faster.",
        feature1: "Deterministic rendering",
        feature2: "Component-based",
        feature3: "GSAP motion engine",
        ctaText: "Available Now",

        // Fonts
        fontDisplay: "'Helvetica Neue', sans-serif",
        fontBody: "'Helvetica Neue', sans-serif"
      };
    </script>
    <style type="text/tailwindcss">
      @theme {
        --color-brand-primary: var(--brand-color-primary);
        --color-brand-secondary: var(--brand-color-secondary);
        --color-bg-base: var(--background-color);
        --color-text-base: var(--text-color);
        --color-accent: var(--accent-color);
        --font-display: var(--font-display);
        --font-body: var(--font-body);
      }
    </style>
    <script>
      // Apply variables to CSS root for Tailwind
      document.documentElement.style.setProperty('--brand-color-primary', window.__vars.brandColorPrimary);
      document.documentElement.style.setProperty('--brand-color-secondary', window.__vars.brandColorSecondary);
      document.documentElement.style.setProperty('--background-color', window.__vars.backgroundColor);
      document.documentElement.style.setProperty('--text-color', window.__vars.textColor);
      document.documentElement.style.setProperty('--accent-color', window.__vars.accentColor);
      document.documentElement.style.setProperty('--font-display', window.__vars.fontDisplay);
      document.documentElement.style.setProperty('--font-body', window.__vars.fontBody);
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--background-color);
      }
    </style>
    <script>
      // Tailwind v4 readiness shim for HyperFrames
      window.__tailwindReady = new Promise(function(resolve){
        var loaded=document.readyState==="complete";
        var resolved=false;
        var observer;
        function readTailwindCss(){var styles=document.querySelectorAll("style");for(var i=styles.length-1;i>=0;i--){var text=styles[i].textContent||"";if(text.indexOf("tailwindcss v")!==-1)return text;}return "";}
        function finish(){if(resolved||!loaded||!readTailwindCss())return;resolved=true;if(observer)observer.disconnect();resolve(true);}
        observer=new MutationObserver(finish);
        observer.observe(document.documentElement,{childList:true,subtree:true,characterData:true});
        if(loaded){finish();}else{window.addEventListener("load",function(){loaded=true;finish();},{once:true});}
      });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.2.4/dist/index.global.js" integrity="sha384-v5YF9xS+gLRWdvrQ0u/WRbCkjSIH0NjHIPe8tBL1ZRrmI7PiSH6LLdzs0aAIMCuh" crossorigin="anonymous"></script>
  </head>
  <body class="bg-bg-base text-text-base font-body antialiased">
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1080"
      data-height="1920"
      class="relative w-full h-full overflow-hidden"
    >
      
      <!-- Sub-compositions -->
      <!-- Scene 1: Teaser -->
      <div
        id="comp-scene-1"
        class="clip"
        data-start="0"
        data-duration="5"
        data-track-index="1"
        data-composition-src="./compositions/scene1.html"
        data-composition-id="scene1"
      ></div>

      <!-- Scene 2: Product Name Reveal -->
      <div
        id="comp-scene-2"
        class="clip"
        data-start="4"
        data-duration="6"
        data-track-index="2"
        data-composition-src="./compositions/scene2.html"
        data-composition-id="scene2"
      ></div>

      <!-- Scene 3: Features & CTA -->
      <div
        id="comp-scene-3"
        class="clip"
        data-start="9"
        data-duration="6"
        data-track-index="3"
        data-composition-src="./compositions/scene3.html"
        data-composition-id="scene3"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
