<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />

    <!-- Load Tailwind v4 from CDN for runtime styling (required for HyperFrames) -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>

    <!-- GSAP for animations -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

    <script>
      // Global variable configuration block for HyperFrames template
      window.__vars = {
        // Timing
        duration: 8,           // Total video duration in seconds

        // Colors & Background
        bgColor: "#1a1a1a",    // Dark background for meme focus
        accentColor: "#ff3b30",// Vibrant accent for highlights

        // Typography
        fontFamily: "Impact, montserrat, sans-serif", // Deterministic fallback
        textColor: "#ffffff",  // Primary text color
        textStroke: "2px #000000", // Outline for meme text

        // Content
        topText: "WHEN YOU FINALLY FIX", // Top caption
        bottomText: "THAT ONE BUG",      // Bottom caption

        // Media
        // Using a generic placeholder image. Buyer should replace this with their reaction video/image
        mediaUrl: "https://placehold.co/1080x1080/444/999?text=Reaction+Image",
        mediaType: "image", // 'image' or 'video'

        // Animation
        animationSpeed: 1.0, // Multiplier for animation speed
      };
    </script>

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background-color: var(--bg-color, #000);
      }

      /* Dynamic theme application from __vars */
      :root {
        --meme-font: Impact, montserrat, sans-serif;
      }

      .meme-text {
        font-family: var(--meme-font);
        text-transform: uppercase;
        text-align: center;
        line-height: 1.1;
        text-shadow:
          -2px -2px 0 #000,
           2px -2px 0 #000,
          -2px  2px 0 #000,
           2px  2px 0 #000,
           4px  4px 0 rgba(0,0,0,0.5); /* extra drop shadow */
      }
    </style>
  </head>
  <body>
    <!-- Root Composition: 9:16 aspect ratio (1080x1920) -->
    <div
      id="root"
      data-composition-id="meme-reaction"
      data-start="0"
      data-duration="8"
      data-width="1080"
      data-height="1920"
      class="w-full h-full relative flex flex-col items-center justify-center"
    >
      
      <!-- Sub-composition for the main meme content -->
      <div
        id="meme-content"
        data-composition-id="meme-content"
        class="clip w-full h-full absolute inset-0"
        data-start="0"
        data-duration="8"
        data-track-index="1"
        data-composition-src="compositions/meme-content.html"
      ></div>

    </div>

    <script>
      // Apply variables to styling and DOM
      document.body.style.setProperty('--bg-color', window.__vars.bgColor);

      // Update root duration
      document.getElementById('root').setAttribute('data-duration', window.__vars.duration);
      document.getElementById('meme-content').setAttribute('data-duration', window.__vars.duration);

      // GSAP Timeline setup
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // The main timeline doesn't need to do much since the sub-composition will handle its own animations,
      // but we register it anyway.

      window.__timelines["meme-reaction"] = tl;
    </script>
  </body>
</html>
