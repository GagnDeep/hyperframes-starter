<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <div
      id="intro-root"
      data-composition-id="intro"
      data-start="0"
      data-duration="3"
      data-width="1080"
      data-height="1920"
      class="w-full h-full flex flex-col items-center justify-center relative overflow-hidden"
    >
      <div class="absolute inset-0 z-0 bg-gradient-to-br from-[var(--bg-primary)] to-[var(--bg-secondary)]" id="intro-bg" data-layout-allow-overflow></div>

      <!-- Safe zone container (top: 250px, bottom: 600px) -->
      <div class="z-10 flex flex-col items-center justify-center w-[800px] h-[1070px] mx-auto my-[250px] text-center">
        <div id="intro-badge" class="px-6 py-2 rounded-full mb-8" style="background-color: var(--accent-color);">
          <span id="intro-title-top" class="text-3xl font-bold tracking-widest text-white uppercase"></span>
        </div>
        <h1 id="intro-title-main" class="text-[120px] leading-[1.1] font-black uppercase" style="color: var(--text-primary);"></h1>
      </div>
    </div>

    <script>
      // Apply variables
      const v = window.parent.__vars || window.__vars;
      if (v) {
        document.getElementById('intro-title-top').innerText = v.title_top;
        document.getElementById('intro-title-main').innerText = v.title_main;
        document.getElementById('intro-root').style.setProperty('--bg-primary', v.bg_primary);
        document.getElementById('intro-root').style.setProperty('--bg-secondary', v.bg_secondary);
        document.getElementById('intro-root').style.setProperty('--accent-color', v.accent_color);
        document.getElementById('intro-root').style.setProperty('--text-primary', v.text_primary);
      }

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Entry Animation
      tl.from("#intro-bg", { scale: 1.1, duration: 3, ease: "power1.out" }, 0)
        .from("#intro-badge", { y: 50, opacity: 0, duration: 1, ease: "back.out(1.5)" }, 0.2)
        .from("#intro-title-main", { y: 100, opacity: 0, duration: 1, ease: "power3.out" }, 0.4);

      // Exit Animation (hard kill)
      tl.to(["#intro-badge", "#intro-title-main"], { y: -50, opacity: 0, duration: 0.5, ease: "power2.inOut" }, 2.5);
      tl.set("#intro-root", { opacity: 0 }, 3);

      window.__timelines["intro"] = tl;
    </script>
  </body>
</html>
