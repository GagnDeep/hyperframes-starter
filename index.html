<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />

    <!-- GSAP for animations -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!-- Tailwind v4 browser-runtime for styling -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>

    <script>
      // Single configuration object for all customizable values.
      // Every editable value must be exposed here.
      window.__vars = {
        // Theme Colors (using a Bold/Energetic palette)
        // High contrast adjustment for WCAG compliance
        colors: {
          bg: "#073B4C",       // Deep blue background
          accent: "#000000",   // Black accent for high contrast on bright colors
          fg: "#FFFFFF",       // White text
          highlight: "#EF476F" // Pink highlight
        },
        // Typography
        fonts: {
          main: "system-ui, -apple-system, sans-serif",
          bold: "Impact, system-ui, sans-serif"
        },
        // Content
        text: {
          brand: "ACME CORP",
          hook: "FLASH SALE",
          discount: "50% OFF",
          subtext: "LIMITED TIME ONLY",
          cta: "SHOP NOW"
        },
        // Timings (in seconds)
        timing: {
          totalDuration: 10,
          introStart: 0,
          introDuration: 3,
          productStart: 3,
          productDuration: 4,
          outroStart: 7,
          outroDuration: 3
        },
        // Images (placeholders for now)
        media: {
          productImg: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=1080&h=1080&auto=format&fit=crop"
        }
      };
    </script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      /* Apply background color from vars early to prevent flicker */
      body {
        background-color: var(--theme-bg, #000);
        font-family: var(--font-main, sans-serif);
      }
    </style>
  </head>
  <body>
    <!-- Apply vars to CSS Custom Properties for Tailwind/CSS to use -->
    <script>
      document.body.style.setProperty('--theme-bg', window.__vars.colors.bg);
      // Swapping accent back to yellow, but using it as bg and black text for contrast
      document.body.style.setProperty('--theme-accent', '#FFD166');
      document.body.style.setProperty('--theme-accent-fg', '#000000');
      document.body.style.setProperty('--theme-fg', window.__vars.colors.fg);
      document.body.style.setProperty('--theme-highlight', window.__vars.colors.highlight);
      document.body.style.setProperty('--font-main', window.__vars.fonts.main);
      document.body.style.setProperty('--font-bold', window.__vars.fonts.bold);
    </script>

    <!-- Main Composition Root: 9:16 aspect ratio (1080x1920) for Social -->
    <div
      id="root"
      data-composition-id="flash-sale-main"
      data-start="0"
      data-duration="10"
      data-width="1080"
      data-height="1920"
      class="relative w-full h-full overflow-hidden flex flex-col"
      style="background-color: var(--theme-bg);"
    >
      
      <!-- Global Ambient Background Layer -->
      <div id="ambient-bg" class="clip absolute inset-0 z-0 opacity-20 pointer-events-none" data-start="0" data-duration="10" data-track-index="0">
        <!-- Accent Glows -->
        <div id="glow-1" class="absolute w-[800px] h-[800px] rounded-full blur-[100px] -top-40 -left-40" style="background: var(--theme-highlight);"></div>
        <div id="glow-2" class="absolute w-[1000px] h-[1000px] rounded-full blur-[150px] -bottom-60 -right-20" style="background: var(--theme-accent);"></div>

        <!-- Grid Pattern (Data/Tech feel) -->
        <div class="absolute inset-0" style="background-image: linear-gradient(rgba(255,255,255,0.05) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,0.05) 2px, transparent 2px); background-size: 100px 100px;"></div>
      </div>

      <!-- Sub-compositions (Modular sections) -->
      <!-- Track indices offset to avoid conflicts: Intro(1), Product(2), Outro(3) -->
      
      <div
        id="comp-intro"
        class="clip absolute inset-0 z-10"
        data-composition-id="intro"
        data-composition-src="compositions/intro.html"
        data-start="0"
        data-duration="3"
        data-track-index="1"
        data-layout-allow-overflow
      ></div>

      <div
        id="comp-product"
        class="clip absolute inset-0 z-20"
        data-composition-id="product"
        data-composition-src="compositions/product.html"
        data-start="3"
        data-duration="4"
        data-track-index="2"
        data-layout-allow-overflow
      ></div>

      <div
        id="comp-outro"
        class="clip absolute inset-0 z-30"
        data-composition-id="outro"
        data-composition-src="compositions/outro.html"
        data-start="7"
        data-duration="3"
        data-track-index="3"
        data-layout-allow-overflow
      ></div>

    </div>

    <script>
      // Register Main Timeline
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Global Ambient Motion
      tl.to("#glow-1", { scale: 1.2, x: 50, y: 50, duration: 5, ease: "sine.inOut", repeat: 1, yoyo: true }, 0);
      tl.to("#glow-2", { scale: 1.3, x: -80, y: -40, duration: 6, ease: "sine.inOut", repeat: 1, yoyo: true }, 0);

      window.__timelines["flash-sale-main"] = tl;
    </script>
  </body>
</html>
