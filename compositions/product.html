<div class="relative w-full h-full flex flex-col items-center justify-center overflow-hidden perspective-1000"
     data-composition-id="product"
     data-width="1080"
     data-height="1920">
  <style>
    .perspective-1000 {
      perspective: 1000px;
    }
    #product-discount {
      font-family: var(--font-bold, sans-serif);
      color: var(--theme-accent-fg);
      background-color: var(--theme-accent);
      box-shadow: 10px 10px 0px var(--theme-highlight);
      line-height: 1.2;
    }
  </style>

  <div id="prod-bg-top" class="absolute top-0 left-0 w-full h-1/2 origin-top" style="background: var(--theme-highlight);"></div>
  <div id="prod-bg-bottom" class="absolute bottom-0 left-0 w-full h-1/2 origin-bottom" style="background: var(--theme-highlight);"></div>

  <div id="product-wrapper" class="relative z-10 w-[600px] h-[600px] rounded-3xl overflow-hidden shadow-2xl border-8" style="border-color: var(--theme-fg);" data-layout-allow-overflow>
    <img id="product-img" class="w-full h-full object-cover origin-center" alt="Product" data-layout-allow-overflow />
  </div>

  <div id="discount-badge" class="absolute z-20 top-1/3 right-10 rotate-12 opacity-0" data-layout-allow-overflow>
    <div id="product-discount" class="text-5xl font-black px-6 py-4 rounded-2xl transform skew-x-[-10deg] max-w-[300px] break-words text-center" data-layout-allow-overflow></div>
  </div>
</div>

<script>
  (function() {
    const vars = window.__vars;

    document.getElementById('product-img').src = vars.media.productImg;
    document.getElementById('product-discount').textContent = vars.text.discount;

    const tl = gsap.timeline({ paused: true });

    tl.fromTo("#prod-bg-top", { scaleY: 0 }, { scaleY: 1, duration: 0.6, ease: "power3.inOut" }, 0);
    tl.fromTo("#prod-bg-bottom", { scaleY: 0 }, { scaleY: 1, duration: 0.6, ease: "power3.inOut" }, 0);

    tl.fromTo("#product-wrapper",
      { z: -500, rotationY: 90, opacity: 0 },
      { z: 0, rotationY: 0, opacity: 1, duration: 1, ease: "power3.out" },
      0.3
    );

    tl.fromTo("#product-img", { scale: 1.2 }, { scale: 1, duration: vars.timing.productDuration, ease: "power1.out" }, 0);

    tl.fromTo("#discount-badge",
      { scale: 0, rotation: -45, opacity: 0 },
      { scale: 1, rotation: 12, opacity: 1, duration: 0.7, ease: "elastic.out(1, 0.4)" },
      1.0
    );

    const exitTime = vars.timing.productDuration - 0.6;
    tl.to("#product-wrapper", { y: -1000, rotationZ: 15, duration: 0.6, ease: "power3.in" }, exitTime);
    tl.to("#discount-badge", { scale: 0, duration: 0.3, ease: "back.in(2)" }, exitTime);
    tl.to("#prod-bg-top", { scaleY: 0, duration: 0.4, ease: "power3.inOut", overwrite: "auto" }, exitTime + 0.2);
    tl.to("#prod-bg-bottom", { scaleY: 0, duration: 0.4, ease: "power3.inOut", overwrite: "auto" }, exitTime + 0.2);

    window.__timelines = window.__timelines || {};
    window.__timelines["product"] = tl;
  })();
</script>
