<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <div
      id="stars-root"
      class="clip flex gap-4 h-[64px] items-center justify-center"
      data-composition-id="star-rating"
      data-width="400"
      data-height="64"
      data-start="0"
      data-duration="10"
      data-track-index="0"
    >
      <div id="stars-container" class="flex gap-4"></div>
    </div>

    <script>
      // Populate text
      const duration = window.__vars.duration;
      document.getElementById('stars-root').setAttribute('data-duration', duration);

      // Generate Stars
      const starsContainer = document.getElementById('stars-container');
      const rating = Math.min(Math.max(window.__vars.rating, 0), 5); // clamp 0-5

      const defaultStar = "M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.006 5.404.434c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.434 2.082-5.005Z";
      const roundedStar = "M12 2l2.4 7.4h7.6l-6 4.6 2.3 7.4-6.3-4.6-6.3 4.6 2.3-7.4-6-4.6h7.6z"; // simple path

      let starPath = defaultStar;
      if (window.__vars.starStyle === "rounded") {
         starPath = roundedStar;
      }

      const starSVG = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-16 h-16 text-brand-star drop-shadow-md">
          <path fill-rule="evenodd" d="${starPath}" clip-rule="evenodd" />
        </svg>
      `;

      for(let i=0; i<5; i++) {
        const starEl = document.createElement('div');
        starEl.className = 'star-icon opacity-0';

        starEl.innerHTML = starSVG;

        // Solid star if i < rating, otherwise faded out
        if (i >= rating) {
           starEl.classList.add('opacity-20');
           starEl.classList.remove('opacity-0'); // Will stay dim
        }
        starsContainer.appendChild(starEl);
      }

      // Timeline
      window.__timelines = window.__timelines || {};
      const starTl = gsap.timeline({ paused: true });

      // Stagger stars
      const filledStars = document.querySelectorAll('#stars-container .star-icon:not(.opacity-20)');
      starTl.fromTo(filledStars,
        { opacity: 0, scale: 0.5, rotation: -30 },
        { opacity: 1, scale: 1, rotation: 0, duration: 0.8, stagger: 0.1, ease: "back.out(1.7)" },
        1.4
      );

      // Memory check hard kill
      starTl.set("#stars-container", { opacity: 0 }, duration);

      window.__timelines["star-rating"] = starTl;
    </script>
  </body>
</html>
