<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
    </style>

<script>
window.__tailwindReady=new Promise(function(resolve){
var loaded=document.readyState==="complete";
var resolved=false;
var observer;
function readTailwindCss(){var styles=document.querySelectorAll("style");for(var i=styles.length-1;i>=0;i--){var text=styles[i].textContent||"";if(text.indexOf("tailwindcss v")!==-1)return text;}return "";}
function finish(){if(resolved||!loaded||!readTailwindCss())return;resolved=true;if(observer)observer.disconnect();resolve(true);}
observer=new MutationObserver(finish);
observer.observe(document.documentElement,{childList:true,subtree:true,characterData:true});
if(loaded){finish();}else{window.addEventListener("load",function(){loaded=true;finish();},{once:true});}
});
</script>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.2.4/dist/index.global.js" integrity="sha384-v5YF9xS+gLRWdvrQ0u/WRbCkjSIH0NjHIPe8tBL1ZRrmI7PiSH6LLdzs0aAIMCuh" crossorigin="anonymous"></script>

<style type="text/tailwindcss">
  @theme {
    --color-bg-primary: var(--vars-bg-primary);
    --color-text-primary: var(--vars-text-primary);
    --color-accent: var(--vars-accent);
  }
</style>

<script>
  // Expose every customizable value as a labeled variable
  window.__vars = {
    // Colors
    bgPrimary: "#fdfdfd",
    textPrimary: "#111827",
    accent: "#ef4444",
    cardBg: "#ffffff",
    cardShadow: "rgba(0, 0, 0, 0.1)",

    // Typography
    fontFamily: "Inter, sans-serif",
    titleText: "New Arrivals",
    subtitleText: "Spring Collection 2024",

    // Items
    items: [
      {
        title: "Minimalist Watch",
        price: "$129",
        category: "Accessories",
        image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?q=80&w=1000&auto=format&fit=crop"
      },
      {
        title: "Leather Backpack",
        price: "$199",
        category: "Bags",
        image: "https://images.unsplash.com/photo-1491637639811-60e2756cc1c7?q=80&w=1000&auto=format&fit=crop"
      },
      {
        title: "Classic Sunglasses",
        price: "$89",
        category: "Eyewear",
        image: "https://images.unsplash.com/photo-1511499767150-a48a237f0083?q=80&w=1000&auto=format&fit=crop"
      }
    ],

    // Timing (seconds)
    totalDuration: 15,
    introDuration: 1,
    itemDuration: 3,
    transitionDuration: 0.8
  };

  // Set CSS variables for Tailwind globally
  document.documentElement.style.setProperty("--vars-bg-primary", window.__vars.bgPrimary);
  document.documentElement.style.setProperty("--vars-text-primary", window.__vars.textPrimary);
  document.documentElement.style.setProperty("--vars-accent", window.__vars.accent);
</script>

<style>
  body {
    font-family: sans-serif;
    color: var(--vars-text-primary);
  }

  .carousel-container {
    position: absolute;
    top: 260px;
    left: 0;
    width: 100%;
    height: 700px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .carousel-item {
    position: absolute;
    display: flex;
    gap: 60px;
    align-items: center;
    width: 1100px;
    background-color: var(--cardBg);
    border-radius: 24px;
    padding: 40px;
    box-shadow: 0 25px 50px -12px var(--cardShadow);
    opacity: 0;
    z-index: 20;
  }

  .item-image-container {
    width: 460px;
    height: 460px;
    border-radius: 16px;
    overflow: hidden;
    flex-shrink: 0;
    position: relative;
  }

  .item-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .item-details {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 500px;
  }

  .item-category {
    font-size: 24px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 600;
    color: var(--vars-accent);
  }

  .item-title {
    font-size: 56px;
    font-weight: 800;
    line-height: 1.1;
    color: var(--vars-text-primary);
    text-wrap: balance;
  }

  .item-price {
    font-size: 48px;
    font-weight: 300;
    color: var(--vars-text-primary);
    margin-top: 24px;
  }
</style>
</head>
  <body>
    <!-- Root composition -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1920"
      data-height="1080"
      style="position: relative; width: 1920px; height: 1080px;"
    >
      <!-- Script injects correct root duration and elements dynamically for proper rendering and sub-composition resolution -->

      <!-- Sub-compositions -->
      <div id="bg-comp" class="clip" data-composition-id="background" data-composition-src="compositions/background.html" data-start="0" data-duration="15" data-track-index="0"></div>

      <div id="header-comp" class="clip" data-composition-id="header" data-composition-src="compositions/header.html" data-start="0" data-duration="15" data-track-index="1"></div>

      <!-- Carousel container (generated dynamically via script) -->
      <div id="carousel-section" class="clip carousel-container" data-layout-allow-overflow="true" data-start="0" data-duration="15" data-track-index="2"></div>
    </div>

    <script>
      // Apply correct totalDuration dynamically to HTML elements before capture starts
      const v = window.__vars;
      document.getElementById('root').setAttribute('data-duration', v.totalDuration);
      document.getElementById('bg-comp').setAttribute('data-duration', v.totalDuration);
      document.getElementById('header-comp').setAttribute('data-duration', v.totalDuration);
      document.getElementById('carousel-section').setAttribute('data-duration', v.totalDuration);
      document.body.style.fontFamily = window.__vars.fontFamily;

      // Inject carousel items
      const carouselSection = document.getElementById('carousel-section');
      carouselSection.innerHTML = v.items.map((item, index) => `
        <div id="item-${index}" class="carousel-item" style="--cardBg: ${v.cardBg}; --cardShadow: ${v.cardShadow}">
          <div class="item-image-container">
            <img src="${item.image}" class="item-image" id="item-img-${index}" crossorigin="anonymous" />
            <div class="absolute inset-0 bg-black/5" id="item-overlay-${index}"></div>
          </div>
          <div class="item-details">
            <div class="item-category" id="item-cat-${index}">${item.category}</div>
            <div class="item-title" id="item-title-${index}">${item.title}</div>
            <div class="item-price" id="item-price-${index}">${item.price}</div>
          </div>
        </div>
      `).join('');

      // GSAP Animations
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Carousel sequence
      let timeOffset = v.introDuration;

      v.items.forEach((item, index) => {
        const itemEl = `#item-${index}`;
        const img = `#item-img-${index}`;
        const cat = `#item-cat-${index}`;
        const title = `#item-title-${index}`;
        const price = `#item-price-${index}`;

        // Ensure initial state in CSS positions
        tl.set(itemEl, { zIndex: 10 + index }, 0);

        // Entrance
        tl.fromTo(itemEl,
          { x: 400, opacity: 0, scale: 0.9, rotationY: -15 },
          { x: 0, opacity: 1, scale: 1, rotationY: 0, duration: 1, ease: "power4.out" },
          timeOffset
        );

        // Inner elements entrance (staggered)
        tl.from(img, { scale: 1.2, duration: 1.5, ease: "power3.out" }, timeOffset);
        tl.from(cat, { x: 30, opacity: 0, duration: 0.8, ease: "power2.out" }, timeOffset + 0.2);
        tl.from(title, { x: 40, opacity: 0, duration: 0.8, ease: "power3.out" }, timeOffset + 0.3);
        tl.from(price, { y: 20, opacity: 0, duration: 0.8, ease: "power2.out" }, timeOffset + 0.4);

        // If not the last item, exit animation
        if (index < v.items.length - 1) {
          const exitTime = timeOffset + v.itemDuration;
          tl.to(itemEl, {
            x: -400,
            opacity: 0,
            scale: 0.9,
            rotationY: 15,
            duration: v.transitionDuration,
            ease: "power3.inOut"
          }, exitTime);

          timeOffset = exitTime + v.transitionDuration * 0.5; // Slight overlap
        } else {
          // Last item just fades out at the very end
          tl.to(itemEl, { opacity: 0, duration: 0.5 }, v.totalDuration - 0.5);
        }
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
