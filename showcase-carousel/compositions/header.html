<template id="header-template">
  <div data-composition-id="header" data-width="1920" data-height="1080">
    <div id="header-container" class="w-full flex flex-col items-center text-center z-10 absolute top-[100px] left-0">
      <h2 id="subtitle" class="text-3xl tracking-widest uppercase font-semibold text-accent mb-4"></h2>
      <h1 id="title" class="text-8xl font-black text-primary"></h1>
    </div>

    <style>
      #header .text-accent {
        color: var(--vars-accent, #ef4444);
      }
      #header .text-primary {
        color: var(--vars-text-primary, #111827);
      }
      #header #header-container {
        font-family: sans-serif;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function() {
        // Initialize GSAP timeline
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Populate content if variables exist (they are passed down globally)
        const v = window.__vars || {};
        if (v.subtitleText) document.getElementById('subtitle').innerText = v.subtitleText;
        if (v.titleText) document.getElementById('title').innerText = v.titleText;
        if (v.fontFamily) document.getElementById('header-container').style.fontFamily = v.fontFamily;

        // Entrance animations
        tl.from("#subtitle", { y: -30, opacity: 0, duration: 1, ease: "power3.out" }, 0.2);
        tl.from("#title", { y: 40, opacity: 0, duration: 1.2, ease: "expo.out" }, 0.4);

        // Exit animations - assuming totalDuration - 0.5s fade out
        if (v.totalDuration) {
          tl.to(["#title", "#subtitle"], { opacity: 0, y: -20, duration: 0.5 }, v.totalDuration - 0.5);
        }

        window.__timelines["header"] = tl;
      })();
    </script>
  </div>
</template>
