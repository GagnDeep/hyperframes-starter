<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <div
      id="bg-layer-root"
      class="clip absolute inset-0 w-full h-full"
      data-composition-id="bg-layer"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="10"
      data-track-index="0"
    >
      <!-- Decorative elements in bg -->
      <div id="bg-blob-1" class="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] bg-brand-accent/10 rounded-full blur-[120px]"></div>
      <div id="bg-blob-2" class="absolute bottom-[-20%] right-[-10%] w-[60%] h-[60%] bg-brand-accent/5 rounded-full blur-[150px]"></div>
    </div>

    <script>
      const duration = window.__vars.duration;
      document.getElementById('bg-layer-root').setAttribute('data-duration', duration);

      window.__timelines = window.__timelines || {};
      const bgTl = gsap.timeline({ paused: true });

      // Subtle pulse animation for background blobs
      bgTl.fromTo("#bg-blob-1",
        { scale: 1, opacity: 0.5 },
        { scale: 1.2, opacity: 1, duration: duration / 2, ease: "sine.inOut", yoyo: true, repeat: 1 },
        0
      );
      bgTl.fromTo("#bg-blob-2",
        { scale: 1, opacity: 0.5 },
        { scale: 1.1, opacity: 1, duration: duration / 2, ease: "sine.inOut", yoyo: true, repeat: 1 },
        0
      );

      // Memory hard kill not entirely needed here since they persist, but let's be safe if they exit
      bgTl.set(["#bg-blob-1", "#bg-blob-2"], { opacity: 0 }, duration);

      window.__timelines["bg-layer"] = bgTl;
    </script>
  </body>
</html>
