<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
    </style>
    <script>
      // Global variables configuration for the template
      window.__vars = {
        activeTheme: "dark", // Switch between 'dark', 'light', 'vibrant'
        themes: {
          dark: {
            backgroundColor: "#0f172a",
            cardColor: "#1e293b",
            accentColor: "#facc15", // Yellow
            accentTextColor: "#facc15",
            textColor: "#f8fafc",
            mutedTextColor: "#94a3b8",
            fontFamily: "system-ui, sans-serif"
          },
          light: {
            backgroundColor: "#f8fafc",
            cardColor: "#ffffff",
            accentColor: "#3b82f6", // Blue
            accentTextColor: "#3b82f6",
            textColor: "#0f172a",
            mutedTextColor: "#475569",
            fontFamily: "Georgia, serif"
          },
          vibrant: {
            backgroundColor: "#ec4899", // Pink
            cardColor: "#4f46e5", // Indigo
            accentColor: "#34d399", // Emerald
            accentTextColor: "#34d399",
            textColor: "#ffffff",
            mutedTextColor: "#c7d2fe",
            fontFamily: "system-ui, sans-serif"
          }
        },
        content: {
          badge: "DID YOU KNOW?",
          fact: "Honey never spoils. Archaeologists have found pots of honey in ancient Egyptian tombs that are over 3,000 years old and still perfectly edible.",
          source: "Source: Smithsonian Institution"
        },
        timing: {
          duration: 12 // Total duration in seconds
        },
        media: {
          // Provide a dummy src string to satisfy the linter, user will override
          audioUrl: "assets/dummy.mp3",
          // Toggles an image-based subcomp vs a text-only subcomp
          useImageVariant: true,
          imageUrl: "assets/honey.jpg"
        }
      };
    </script>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="12"
      data-width="1080"
      data-height="1920"
      class="clip flex items-center justify-center relative w-full h-full"
      data-track-index="0"
    >
      <div id="bg" class="absolute inset-0 w-full h-full"></div>
      
      <!-- Audio Track -->
      <audio id="bg-audio" class="clip" data-start="0" data-duration="12" data-track-index="1" src="assets/dummy.mp3"></audio>

      <!-- Fact Card Sub-composition dynamically wired in JS to support variant -->
      <div
        id="fact-card-subcomp"
        class="clip absolute inset-0 w-full h-full flex items-center justify-center"
        data-start="0"
        data-duration="12"
        data-track-index="2"
        data-composition-id="card"
        data-composition-src="compositions/card.html"
      ></div>
    </div>

    <script>
      // Make activeTheme values directly accessible as theme for sub-compositions easily without rewriting logic.
      window.__vars.theme = window.__vars.themes[window.__vars.activeTheme] || window.__vars.themes.dark;

      // Apply variables to root elements before rendering
      document.body.style.fontFamily = window.__vars.theme.fontFamily;
      document.getElementById('bg').style.backgroundColor = window.__vars.theme.backgroundColor;

      // Setup audio if provided
      const audioEl = document.getElementById('bg-audio');
      if (window.__vars.media && window.__vars.media.audioUrl) {
        audioEl.src = window.__vars.media.audioUrl;
      } else {
        audioEl.removeAttribute('src');
      }

      // Update durations dynamically based on vars
      const duration = window.__vars.timing.duration;
      const root = document.getElementById('root');
      if (root) root.setAttribute('data-duration', duration);
      if (audioEl) audioEl.setAttribute('data-duration', duration);

      const subcomp = document.getElementById('fact-card-subcomp');
      if (subcomp) {
        subcomp.setAttribute('data-duration', duration);
        // Switch sub-composition if image variant requested
        if (window.__vars.media && window.__vars.media.useImageVariant) {
          subcomp.setAttribute('data-composition-src', 'compositions/card-with-image.html');
        }
      }

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
