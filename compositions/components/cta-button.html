<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
    </style>
  </head>
  <body>
    <div
      id="cta-button-root"
      data-composition-id="cta-button"
      data-start="0"
      data-duration="5"
      data-width="1080"
      data-height="1920"
      class="w-full h-full flex items-center justify-center font-sans"
    >
      <button data-layout-allow-overflow="true" id="cta-button-element" class="px-16 py-8 rounded-full text-5xl font-bold tracking-wide shadow-2xl relative group transform overflow-visible">
        <div id="cta-button-bg" class="absolute inset-0 z-0 rounded-full"></div>
        <span class="relative z-10 text-white whitespace-nowrap" id="cta-button-text"></span>
      </button>
    </div>

    <script>
      // Load variables natively from parent or __hyperframes
      const vars = window.parent.__vars || window.__vars || {
        ctaText: "Shop Now",
        accentColor: "#10b981",
      };

      if (window.__hyperframes && typeof window.__hyperframes.getVariables === 'function') {
         Object.assign(vars, window.__hyperframes.getVariables());
      }

      // Apply data
      document.getElementById('cta-button-text').textContent = vars.ctaText;
      document.getElementById('cta-button-bg').style.backgroundColor = vars.accentColor;

      // GSAP Animation
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      gsap.set("#cta-button-element", { scale: 0.8, opacity: 0, y: 50 });

      // Build sequence
      tl.to("#cta-button-element", {
        scale: 1,
        opacity: 1,
        y: 0,
        duration: 0.8,
        ease: "back.out(1.2)"
      }, 0)
      // Gentle pulsing effect
      .to("#cta-button-element", {
        scale: 1.05,
        duration: 1,
        yoyo: true,
        repeat: 2,
        ease: "sine.inOut"
      }, 1.0);

      window.__timelines["cta-button"] = tl;
    </script>
  </body>
</html>
