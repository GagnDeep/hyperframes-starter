<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"bezelColor","type":"color","label":"Bezel Color","default":"#000000"},
    {"id":"appName","type":"string","label":"App Name","default":"My App"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      #device {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 800px;
        height: 1600px;
        border-radius: 120px;
        border: 24px solid #000;
        box-shadow: 0 40px 80px rgba(0,0,0,0.3), inset 0 0 20px rgba(255,255,255,0.1);
        overflow: hidden;
        background-color: #ffffff;
        display: flex;
        flex-direction: column;
      }
      .dynamic-island {
        position: absolute;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 240px;
        height: 60px;
        background: #000;
        border-radius: 40px;
        z-index: 100;
      }
      .app-header {
        height: 140px;
        padding-top: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-bottom: 2px solid #e2e8f0;
        font-family: sans-serif;
        font-size: 32px;
        font-weight: 600;
        color: #ffffff;
        background-color: #0f172a;
        z-index: 10;
        position: relative;
      }
      .app-body {
        flex: 1;
        padding: 40px;
        display: flex;
        flex-direction: column;
        gap: 32px;
        background-color: #ffffff;
        position: relative;
      }
      .skeleton-block {
        width: 100%;
        border-radius: 24px;
        background: #94a3b8;
      }
      .skeleton-title { height: 48px; width: 60%; }
      .skeleton-hero { height: 400px; }
      .skeleton-text { height: 32px; width: 100%; }
      .skeleton-text-short { height: 32px; width: 80%; }
      .skeleton-text-xs { height: 32px; width: 40%; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="iphone-frame"
      data-width="1080"
      data-height="1920"
      style="background: transparent;"
    >
      <div id="device" class="clip" data-start="0" data-duration="15" data-track-index="1">
        <div class="dynamic-island"></div>
        <div class="app-header" id="app-title">My App</div>
        <div class="app-body">
          <div class="skeleton-block skeleton-title" id="skel-1"></div>
          <div class="skeleton-block skeleton-hero" id="skel-2"></div>
          <div class="skeleton-block skeleton-text" id="skel-3"></div>
          <div class="skeleton-block skeleton-text-short" id="skel-4"></div>
          <div class="skeleton-block skeleton-text-xs" id="skel-5"></div>
        </div>
      </div>
    </div>

    <script>
      const { bezelColor, appName } = window.__hyperframes.getVariables();

      const device = document.getElementById("device");
      device.style.borderColor = bezelColor;

      const title = document.getElementById("app-title");
      title.textContent = appName;
      // Force inline style
      title.style.color = "#ffffff";
      title.style.backgroundColor = "#0f172a";

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      gsap.set("#device", { xPercent: -50, yPercent: -50 });

      // In animation
      tl.fromTo("#device", {
        y: 1000,
        scale: 0.8,
        rotateX: -15
      }, {
        y: 0,
        scale: 1,
        rotateX: 0,
        duration: 1.5,
        ease: "power3.out"
      }, 0);

      // Stagger UI elements inside
      tl.fromTo(".skeleton-block", {
        y: 40,
        opacity: 0
      }, {
        y: 0,
        opacity: 1,
        duration: 0.8,
        stagger: 0.1,
        ease: "power2.out"
      }, 0.5);

      // Scroll effect
      tl.to(".app-body", {
        y: -150,
        duration: 2,
        ease: "power2.inOut"
      }, 3);

      window.__timelines["iphone-frame"] = tl;
    </script>
  </body>
</html>
