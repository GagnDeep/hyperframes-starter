<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
    </style>
    <script>
      // Single Configuration Object for easy template customization.
      // Modifying these values will automatically rebrand the whole composition.
      window.__vars = {
        colors: {
          bg1: "#000000",       // Primary background (Intro & CTA)
          bg2: "#facc15",       // Secondary background (Offer)
          primary: "#ffffff",   // Main text color
          accent: "#facc15",    // Highlight color
          badgeBg: "#000000",   // Offer badge background
          badgeText: "#ffffff", // Offer badge text
          offerText: "#000000", // Offer primary text
          textMuted: "#9ca3af"  // Muted text (website URL)
        },
        texts: {
          introHook: "Black\nFriday",
          introSub: "Early Access",
          offerBadge: "Site-wide",
          offerAmount: "50",
          offerDesc: "Our biggest sale of the year. Everything must go.",
          ctaUrgency: "Sale ends\nTonight",
          ctaButton: "Shop Now",
          ctaWebsite: "yourstore.com"
        },
        fonts: {
          family: "Inter, sans-serif"
        }
      };
    </script>
  </head>
  <body>
    <!-- Root composition: 15s total (3 clips x 5s each) -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1080"
      data-height="1920"
      class="w-full h-full relative"
    >
      
      <!-- Intro Section -->
      <div
        id="comp-intro"
        class="clip absolute inset-0 w-full h-full"
        data-composition-id="intro"
        data-start="0"
        data-duration="5"
        data-track-index="1"
        data-composition-src="compositions/intro.html"
      ></div>

      <!-- Offer Section -->
      <div
        id="comp-offer"
        class="clip absolute inset-0 w-full h-full"
        data-composition-id="offer"
        data-start="5"
        data-duration="5"
        data-track-index="1"
        data-composition-src="compositions/offer.html"
      ></div>

      <!-- CTA Section -->
      <div
        id="comp-cta"
        class="clip absolute inset-0 w-full h-full"
        data-composition-id="cta"
        data-start="10"
        data-duration="5"
        data-track-index="1"
        data-composition-src="compositions/cta.html"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      // Create paused main timeline.
      // Sub-composition timelines are automatically nested by the HyperFrames engine based on data-start and data-duration.
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;

      // Apply base font
      document.body.style.fontFamily = window.__vars.fonts.family;
    </script>
  </body>
</html>
