<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1080"
      data-height="1920"
      class="relative w-full h-full bg-zinc-950 overflow-hidden font-sans"
    >
      <script>
        // Variables definitions for HyperFrames CLI overriders
        document.documentElement.dataset.compositionVariables = JSON.stringify([
          { id: "productName", type: "string", label: "Product Name", default: "HyperShoe Pro" },
          { id: "tagline", type: "string", label: "Tagline", default: "Step into the future." },
          { id: "price", type: "string", label: "Price", default: "$199" },
          { id: "ctaText", type: "string", label: "CTA Text", default: "Shop Now" },
          { id: "primaryColor", type: "color", label: "Primary Color", default: "#3b82f6" },
          { id: "accentColor", type: "color", label: "Accent Color", default: "#10b981" },
          { id: "bgColor", type: "color", label: "Background Color", default: "#09090b" },
          { id: "textColor", type: "color", label: "Text Color", default: "#ffffff" },
          { id: "productImage", type: "image", label: "Product Image URL", default: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&q=80&w=1080&h=1080" },
          { id: "logoUrl", type: "image", label: "Logo URL", default: "https://images.unsplash.com/photo-1611162617474-5b21e879e113?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8bG9nb3xlbnwwfHwwfHx8MA%3D%3D" }
        ]);

        // Global vars for direct access in JS (as requested by prompt)
        window.__vars = {
          productName: "HyperShoe Pro",
          tagline: "Step into the future.",
          price: "$199",
          ctaText: "Shop Now",
          primaryColor: "#3b82f6",
          accentColor: "#10b981",
          bgColor: "#09090b",
          textColor: "#ffffff",
          productImage: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&q=80&w=1080&h=1080",
          logoUrl: "https://images.unsplash.com/photo-1611162617474-5b21e879e113?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8bG9nb3xlbnwwfHwwfHx8MA%3D%3D"
        };

        // Merge from CLI if present
        if (window.__hyperframes && typeof window.__hyperframes.getVariables === 'function') {
           const hfVars = window.__hyperframes.getVariables();
           window.__vars = { ...window.__vars, ...hfVars };
        }
      </script>

      <!-- Background -->
      <div class="absolute inset-0 z-0" id="bg-element"></div>
      
      <!-- Sub-compositions -->
      <!-- Intro Scene (0-5s) -->
      <div
        data-composition-id="intro"
        class="clip absolute inset-0 z-10"
        data-composition-src="compositions/intro.html"
        data-start="0"
        data-duration="5"
        data-track-index="1">
      </div>

      <!-- Product Showcase Scene (4.5-10.5s, overlap for transition) -->
      <div
        data-composition-id="showcase"
        class="clip absolute inset-0 z-20"
        data-composition-src="compositions/showcase.html"
        data-start="4.5"
        data-duration="6"
        data-track-index="2">
      </div>

      <!-- Outro CTA Scene (10-15s, overlap for transition) -->
      <div
        data-composition-id="outro"
        class="clip absolute inset-0 z-30"
        data-composition-src="compositions/outro.html"
        data-start="10"
        data-duration="5"
        data-track-index="3">
      </div>
      
    </div>

    <script>
      // Apply root styles from vars
      document.getElementById('bg-element').style.backgroundColor = window.__vars.bgColor;
      document.getElementById('root').style.color = window.__vars.textColor;

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // We don't animate scenes via main TL directly here since they are self-contained
      // The runtime will play them based on data-start and data-duration

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
