<div
  id="intro-root"
  data-composition-id="intro"
  data-start="0"
  data-duration="3"
  data-width="1080"
  data-height="1920"
  class="w-full h-full relative flex flex-col items-center justify-center overflow-hidden"
>
  <!-- Background Pattern / Elements -->
  <div class="absolute inset-0 z-0 flex items-center justify-center opacity-20">
    <div id="intro-circle-1" class="absolute w-[800px] h-[800px] rounded-full border-[20px] border-[var(--theme-primary)]"></div>
    <div id="intro-circle-2" class="absolute w-[1200px] h-[1200px] rounded-full border-[10px] border-[var(--theme-accent)]"></div>
  </div>

  <!-- Content -->
  <div class="relative z-10 flex flex-col items-center text-center px-12">
    <!-- Brand badge -->
    <div
      id="intro-brand"
      class="mb-12 px-8 py-3 rounded-full border-2 border-[var(--theme-text)]/30 backdrop-blur-sm bg-black/20"
    >
      <span class="text-3xl font-bold tracking-[0.2em]" id="intro-brand-text">BRAND</span>
    </div>

    <!-- Headline -->
    <div class="overflow-visible relative mb-4 p-8">
      <h1
        id="intro-headline"
        class="text-8xl font-black uppercase tracking-tight leading-none text-[var(--theme-primary)]"
        style="text-shadow: 0 10px 30px rgba(0,0,0,0.5);"
      >
        BACK IN STOCK
      </h1>
    </div>

    <!-- Subheadline -->
    <div class="overflow-visible relative mt-8 p-8">
      <h2
        id="intro-subheadline"
        class="text-4xl font-bold text-[var(--theme-text)] opacity-90"
      >
        You asked. We listened.
      </h2>
    </div>
  </div>

  <script>
    // Bind variables (they are available globally from main index.html)
    if (window.__vars) {
      document.getElementById('intro-brand-text').textContent = window.__vars.brand.name;
      document.getElementById('intro-headline').textContent = window.__vars.intro.headline;
      document.getElementById('intro-subheadline').textContent = window.__vars.intro.subheadline;
    }

    // Animation
    window.__timelines = window.__timelines || {};
    const introTl = gsap.timeline({ paused: true });

    // Initial states
    gsap.set("#intro-headline", { yPercent: 100, opacity: 0 });
    gsap.set("#intro-subheadline", { yPercent: 100, opacity: 0 });
    gsap.set("#intro-brand", { scale: 0.8, opacity: 0 });
    gsap.set(["#intro-circle-1", "#intro-circle-2"], { scale: 0, opacity: 0 });

    introTl
      // In
      .to(["#intro-circle-1", "#intro-circle-2"], {
        scale: 1,
        opacity: 0.2,
        duration: 1.2,
        stagger: 0.1,
        ease: "expo.out"
      }, 0)
      .to("#intro-circle-1", {
        rotation: 90,
        duration: 3,
        ease: "none"
      }, 0)
      .to("#intro-circle-2", {
        rotation: -45,
        duration: 3,
        ease: "none"
      }, 0)
      .to("#intro-brand", {
        scale: 1,
        opacity: 1,
        duration: 0.8,
        ease: "back.out(1.5)"
      }, 0.2)
      .to("#intro-headline", {
        yPercent: 0,
        opacity: 1,
        duration: 0.8,
        ease: "power4.out"
      }, 0.4)
      .to("#intro-subheadline", {
        yPercent: 0,
        opacity: 1,
        duration: 0.8,
        ease: "power4.out"
      }, 0.6)

      // Out
      .to("#intro-root", {
        opacity: 0,
        scale: 1.1,
        duration: 0.4,
        ease: "power2.inOut"
      }, 2.6);

    window.__timelines["intro"] = introTl;
  </script>
</div>
