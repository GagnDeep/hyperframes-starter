<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
    </style>
  </head>
  <body>
    <div
      id="outro-root"
      data-composition-id="outro"
      data-start="0"
      data-duration="5"
      data-width="1080"
      data-height="1920"
      class="w-full h-full flex flex-col items-center justify-center relative font-sans"
    >
      <!-- Background elements -->
      <div id="outro-bg" class="absolute inset-0 z-0"></div>

      <!-- Main Content -->
      <div class="z-10 flex flex-col items-center w-full px-12">
        <div id="cta-container" class="w-full flex flex-col items-center bg-white/5 backdrop-blur-2xl rounded-[60px] p-24 border border-white/20 shadow-2xl">

          <img id="outro-logo" src="" alt="Logo" class="w-40 h-40 object-contain filter invert mb-12 opacity-90" />

          <div class="overflow-visible w-full text-center mb-8">
            <h2 id="outro-product" class="text-6xl font-bold tracking-tight"></h2>
          </div>

          <div class="w-full h-1 rounded-full mb-12 overflow-visible" style="background-color: rgba(255,255,255,0.1)">
            <div data-layout-allow-overflow="true" id="divider-line" class="h-full w-full transform -translate-x-full"></div>
          </div>

          <button data-layout-allow-overflow="true" id="cta-button" class="px-16 py-8 rounded-full text-5xl font-bold tracking-wide shadow-2xl overflow-visible relative group transform">
            <div id="cta-button-bg" class="absolute inset-0 z-0"></div>
            <span class="relative z-10 text-white" id="cta-text"></span>
          </button>

        </div>
      </div>
    </div>

    <script>
      // Load variables
      const vars = window.parent.__vars || window.__vars || {
        productName: "Product",
        ctaText: "Shop Now",
        primaryColor: "#3b82f6",
        accentColor: "#10b981",
        logoUrl: ""
      };

      if (window.__hyperframes && typeof window.__hyperframes.getVariables === 'function') {
         Object.assign(vars, window.__hyperframes.getVariables());
      }

      // Apply data
      document.getElementById('outro-logo').src = vars.logoUrl;
      document.getElementById('outro-product').textContent = vars.productName;
      document.getElementById('cta-text').textContent = vars.ctaText;

      document.getElementById('outro-bg').style.background = `linear-gradient(to top, ${vars.primaryColor}33, transparent)`;
      document.getElementById('divider-line').style.backgroundColor = vars.accentColor;
      document.getElementById('cta-button-bg').style.backgroundColor = vars.accentColor;

      // GSAP Animation
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Setup
      gsap.set("#cta-container", { scale: 0.9, y: 100, opacity: 0 });
      gsap.set("#outro-logo", { scale: 0.5, opacity: 0 });
      gsap.set("#outro-product", { y: 100 });
      gsap.set("#cta-button", { scale: 0.8, opacity: 0, y: 50 });

      // Build sequence
      tl.to("#cta-container", {
        scale: 1,
        y: 0,
        opacity: 1,
        duration: 1.2,
        ease: "power3.out"
      }, 0)
      .to("#outro-logo", {
        scale: 1,
        opacity: 1,
        duration: 1,
        ease: "back.out(1.5)"
      }, 0.3)
      .to("#outro-product", {
        y: 0,
        duration: 1,
        ease: "power4.out"
      }, 0.5)
      .to("#divider-line", {
        x: 0,
        duration: 1.5,
        ease: "power3.inOut"
      }, 0.7)
      .to("#cta-button", {
        scale: 1,
        opacity: 1,
        y: 0,
        duration: 0.8,
        ease: "back.out(1.2)"
      }, 1.0)
      // Gentle pulsing effect for the CTA button to draw attention
      .to("#cta-button", {
        scale: 1.05,
        duration: 1,
        yoyo: true,
        repeat: 2,
        ease: "sine.inOut"
      }, 2.0);

      window.parent.__timelines = window.parent.__timelines || {}; window.__timelines["outro"] = tl;
    </script>
  </body>
</html>
