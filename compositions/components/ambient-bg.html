<div class="relative w-full h-full overflow-hidden" data-composition-id="ambient-bg" data-width="1080" data-height="1920">
  <!-- Accent Glows -->
  <div id="glow-1" class="absolute w-[800px] h-[800px] rounded-full blur-[100px] -top-40 -left-40" style="background: var(--theme-highlight);"></div>
  <div id="glow-2" class="absolute w-[1000px] h-[1000px] rounded-full blur-[150px] -bottom-60 -right-20" style="background: var(--theme-accent);"></div>

  <!-- Grid Pattern (Data/Tech feel) -->
  <div class="absolute inset-0" style="background-image: linear-gradient(rgba(255,255,255,0.05) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,0.05) 2px, transparent 2px); background-size: 100px 100px;"></div>
</div>

<script>
  (function() {
    const tl = gsap.timeline({ paused: true });

    // Global Ambient Motion
    tl.to("#glow-1", { scale: 1.2, x: 50, y: 50, duration: 5, ease: "sine.inOut", repeat: 1, yoyo: true }, 0);
    tl.to("#glow-2", { scale: 1.3, x: -80, y: -40, duration: 6, ease: "sine.inOut", repeat: 1, yoyo: true }, 0);

    window.__timelines = window.__timelines || {};
    window.__timelines["ambient-bg"] = tl;
  })();
</script>
