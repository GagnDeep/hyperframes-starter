<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
    </style>
    <script>
      // Global variables configuration for the template
      window.__vars = {
        theme: {
          backgroundColor: "#0f172a", // Background of the video
          cardColor: "#1e293b", // Background of the fact card
          accentColor: "#facc15", // Brighter Yellow accent color
          textColor: "#f8fafc", // Main text color
          mutedTextColor: "#94a3b8", // Subtitle/source text color
          fontFamily: "system-ui, sans-serif" // Global font family
        },
        content: {
          badge: "DID YOU KNOW?",
          fact: "Honey never spoils. Archaeologists have found pots of honey in ancient Egyptian tombs that are over 3,000 years old and still perfectly edible.",
          source: "Source: Smithsonian Institution"
        },
        timing: {
          duration: 12 // Total duration in seconds
        },
        media: {
          // Provide a dummy src string to satisfy the linter, user will override
          audioUrl: "assets/dummy.mp3"
        }
      };
    </script>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="12"
      data-width="1080"
      data-height="1920"
      class="clip flex items-center justify-center relative w-full h-full"
      data-track-index="0"
    >
      <div id="bg" class="absolute inset-0 w-full h-full"></div>
      
      <!-- Audio Track with dummy src to satisfy linter, overridden in JS if provided -->
      <audio id="bg-audio" class="clip" data-start="0" data-duration="12" data-track-index="1" src="assets/dummy.mp3"></audio>

      <!-- Fact Card Sub-composition -->
      <div
        id="fact-card-subcomp"
        class="clip absolute inset-0 w-full h-full flex items-center justify-center"
        data-start="0"
        data-duration="12"
        data-track-index="2"
        data-composition-id="card"
        data-composition-src="compositions/card.html"
      ></div>
    </div>

    <script>
      // Apply variables to root elements before rendering
      document.body.style.fontFamily = window.__vars.theme.fontFamily;
      document.getElementById('bg').style.backgroundColor = window.__vars.theme.backgroundColor;

      // Setup audio if provided
      const audioEl = document.getElementById('bg-audio');
      if (window.__vars.media && window.__vars.media.audioUrl) {
        audioEl.src = window.__vars.media.audioUrl;
      }

      // Update durations dynamically based on vars
      const duration = window.__vars.timing.duration;
      const root = document.getElementById('root');
      if (root) root.setAttribute('data-duration', duration);

      if (audioEl) audioEl.setAttribute('data-duration', duration);

      const subcomp = document.getElementById('fact-card-subcomp');
      if (subcomp) subcomp.setAttribute('data-duration', duration);

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
