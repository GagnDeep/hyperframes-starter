<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div
      id="offer-root"
      data-composition-id="offer"
      data-start="0"
      data-duration="5"
      data-width="1080"
      data-height="1920"
      class="clip w-full h-full flex flex-col items-center justify-center bg-yellow-400"
    >
      <div id="offer-badge" class="bg-black text-white px-12 py-4 rounded-full text-[48px] font-bold uppercase mb-12 transform -rotate-3">
        Site-wide
      </div>
      <div class="flex flex-row items-baseline gap-4">
        <span id="offer-amount" class="text-[250px] font-black text-black leading-none tracking-tighter">
          50
        </span>
        <div class="flex flex-col items-start leading-none">
          <span id="offer-symbol" class="text-[120px] font-black text-black">%</span>
          <span id="offer-word" class="text-[100px] font-black text-black uppercase">Off</span>
        </div>
      </div>
      <p id="offer-desc" class="text-[48px] font-medium text-black mt-16 max-w-[800px] text-center leading-snug">
        Our biggest sale of the year. Everything must go.
      </p>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const vars = window.parent.__vars || window.__vars || {
        colors: { bg2: "#facc15", badgeBg: "#000000", badgeText: "#ffffff", offerText: "#000000" },
        texts: { offerBadge: "Site-wide", offerAmount: "50", offerDesc: "Our biggest sale of the year. Everything must go." },
        fonts: { family: "Inter, sans-serif" }
      };

      const rootEl = document.getElementById("offer-root");
      if (rootEl) {
        document.body.style.fontFamily = vars.fonts.family;
        rootEl.style.backgroundColor = vars.colors.bg2;

        const badgeEl = document.getElementById("offer-badge");
        if (badgeEl) {
          badgeEl.textContent = vars.texts.offerBadge;
          badgeEl.style.backgroundColor = vars.colors.badgeBg;
          badgeEl.style.color = vars.colors.badgeText;
        }

        const amountEl = document.getElementById("offer-amount");
        if (amountEl) {
          amountEl.textContent = vars.texts.offerAmount;
          amountEl.style.color = vars.colors.offerText;
        }

        const symbolEl = document.getElementById("offer-symbol");
        if (symbolEl) symbolEl.style.color = vars.colors.offerText;

        const wordEl = document.getElementById("offer-word");
        if (wordEl) wordEl.style.color = vars.colors.offerText;

        const descEl = document.getElementById("offer-desc");
        if (descEl) {
          descEl.textContent = vars.texts.offerDesc;
          descEl.style.color = vars.colors.offerText;
        }

        tl.from("#offer-badge", { opacity: 0, scale: 0, rotation: 15, duration: 0.6, ease: "back.out(2)" }, 0);
        tl.from("#offer-amount", { opacity: 0, x: -100, duration: 0.8, ease: "power4.out" }, 0.2);
        tl.from(["#offer-symbol", "#offer-word"], { opacity: 0, x: 100, stagger: 0.1, duration: 0.8, ease: "power4.out" }, 0.3);
        tl.from("#offer-desc", { opacity: 0, y: 30, duration: 0.6, ease: "power2.out" }, 0.8);

        // Pulse effect
        tl.to("#offer-amount", { scale: 1.05, duration: 0.3, yoyo: true, repeat: 1, ease: "power1.inOut" }, 2);

        tl.to("#offer-root", { opacity: 0, y: -50, duration: 0.5, ease: "power2.inOut" }, 4.5);
      }

      window.__timelines["offer"] = tl;
    </script>
  </body>
</html>
