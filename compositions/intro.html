<template id="intro-template">
  <div data-composition-id="intro" data-width="1080" data-height="1920">
    <div class="flex flex-col justify-center items-center w-full h-full px-[80px] py-[120px] box-border text-center">
      <div class="text-[64px] font-semibold tracking-[4px] mb-[24px]" id="i-top"></div>
      <div class="text-[140px] leading-[0.9] font-display" id="i-main"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const v = window.__vars;

      // Populate text
      document.getElementById('i-top').textContent = v.content.introTop;
      document.getElementById('i-top').style.color = v.theme.accent;

      document.getElementById('i-main').textContent = v.content.introMain;
      document.getElementById('i-main').style.color = v.theme.textMain;

      // Animation
      tl.from("#i-top", {
        y: 40,
        opacity: 0,
        duration: 0.8,
        ease: "power3.out"
      }, 0.2);

      tl.from("#i-main", {
        y: 60,
        opacity: 0,
        scale: 0.95,
        duration: 1.0,
        ease: "expo.out"
      }, 0.4);

      window.__timelines["intro"] = tl;
    </script>
  </div>
</template>
