<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <!--
      This is a sub-composition, so it does not need standard head/body boilerplate in the final render,
      but valid HTML is preferred. We wrap the content in a composition root.
      It inherits window.__vars and window.__tailwindReady from the parent.
    -->
    <div
      id="review-card-root"
      class="clip flex flex-col items-center justify-center"
      data-composition-id="review-card"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="10"
      data-track-index="0"
    >
      <div
        id="review-card"
        class="bg-brand-card rounded-3xl p-16 shadow-2xl flex flex-col items-center max-w-[1200px] border border-white/5 opacity-0"
        data-layout-allow-overflow
      >
        <!-- Stars Sub-composition -->
        <div id="stars-mount" class="mb-10 h-[64px]" data-composition-id="star-rating" data-composition-src="compositions/star-rating.html"></div>

        <!-- Review Text -->
        <h1
          id="review-text"
          class="text-5xl leading-[1.4] font-medium text-center text-brand-text mb-12 text-balance opacity-0"
        >
        </h1>

        <!-- Author Info -->
        <div id="author-info" class="flex flex-col items-center opacity-0">
          <div id="author-avatar-container" class="w-20 h-20 rounded-full bg-brand-text flex items-center justify-center mb-6 overflow-hidden">
            <img id="author-avatar" src="" alt="Author Avatar" class="w-full h-full object-cover hidden" />
            <span id="author-initial" class="text-3xl font-bold text-brand-bg"></span>
          </div>
          <h3 id="author-name" class="text-2xl font-bold text-brand-text mb-2 drop-shadow-md"></h3>
          <p id="author-role" class="text-xl text-brand-text/80"></p>
        </div>
      </div>
    </div>

    <script>
      // Populate text
      const duration = window.__vars.duration;
      document.getElementById('review-card-root').setAttribute('data-duration', duration);

      document.getElementById('review-text').textContent = `"${window.__vars.reviewText}"`;
      document.getElementById('author-name').textContent = window.__vars.authorName;
      document.getElementById('author-role').textContent = window.__vars.authorRole;

      if (window.__vars.authorAvatarUrl) {
         const img = document.getElementById('author-avatar');
         img.src = window.__vars.authorAvatarUrl;
         img.classList.remove('hidden');
         document.getElementById('author-initial').classList.add('hidden');
      } else {
         document.getElementById('author-initial').textContent = window.__vars.authorName.charAt(0).toUpperCase();
      }

      // Timeline
      window.__timelines = window.__timelines || {};
      const cardTl = gsap.timeline({ paused: true });

      // Enter animation
      cardTl.fromTo("#review-card",
        { opacity: 0, scale: 0.9, y: 50 },
        { opacity: 1, scale: 1, y: 0, duration: 1.2, ease: "power3.out" },
        1.0
      );

      // Fade in review text
      cardTl.fromTo("#review-text",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 1.5, ease: "expo.out" },
        1.8
      );

      // Fade in author
      cardTl.fromTo("#author-info",
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 1.2, ease: "sine.out" },
        2.2
      );

      // Exit animation
      const outTime = duration - 1.5;
      cardTl.to("#review-card",
        { opacity: 0, scale: 0.95, y: -30, duration: 1, ease: "power2.inOut" },
        outTime
      );

      // Memory check: "always append a hard kill using tl.set('.element', { opacity: 0 }, time) at the clip's end boundary"
      cardTl.set("#review-card", { opacity: 0 }, duration);

      window.__timelines["review-card"] = cardTl;
    </script>
  </body>
</html>
