<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- GSAP for animations -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <!-- Tailwind v4 -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
    </style>
    <script>
      // Exposed variables for the template
      window.__vars = {
        theme: {
          bg: "#000000", // Background color
          accent: "#FF3366", // Accent color for highlights/code
          textMain: "#FFFFFF", // Main text color
          textMuted: "#CCCCCC" // Subtitle/muted text color
        },
        fonts: {
          main: "Inter, sans-serif",
          display: "'Bebas Neue', sans-serif"
        },
        content: {
          introTop: "WAIT FOR IT...",
          introMain: "WE HAVE A SURPRISE FOR YOU",
          revealText: "YOUR EXCLUSIVE CODE:",
          discountCode: "SAVE20NOW",
          discountAmount: "20% OFF ALL ITEMS",
          outroText: "LINK IN BIO",
          outroCta: "SHOP NOW"
        },
        timing: {
          introDuration: 3.5,
          revealDuration: 4.5,
          outroDuration: 4.0,
        }
      };

      document.write(`
        <style>
          @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap');
          body { background-color: ${window.__vars.theme.bg}; font-family: ${window.__vars.fonts.main}; color: ${window.__vars.theme.textMain}; }
          .font-display { font-family: ${window.__vars.fonts.display}; }
        </style>
      `);
    </script>
  </head>
  <body>
    <!-- Root composition -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1080"
      data-height="1920"
      class="relative w-full h-full"
    >
      <!-- Background track -->
      <div
        id="bg-layer"
        class="clip absolute inset-0 z-0"
        data-start="0"
        data-track-index="0"
      >
        <div id="bg-fill" class="w-full h-full opacity-0"></div>
      </div>

      <!-- Main scenes track -->
      <div
        id="scene-intro"
        class="clip absolute inset-0 z-10"
        data-composition-id="intro"
        data-composition-src="compositions/intro.html"
        data-start="0"
        data-track-index="1"
      ></div>

      <div
        id="scene-reveal"
        class="clip absolute inset-0 z-10"
        data-composition-id="reveal"
        data-composition-src="compositions/reveal.html"
        data-track-index="1"
      ></div>

      <div
        id="scene-outro"
        class="clip absolute inset-0 z-10"
        data-composition-id="outro"
        data-composition-src="compositions/outro.html"
        data-track-index="1"
      ></div>
    </div>

    <script>
      // Apply timings dynamically
      const tv = window.__vars.timing;
      const tIntro = tv.introDuration;
      const tReveal = tv.revealDuration;
      const tOutro = tv.outroDuration;
      const totalTime = tIntro + tReveal + tOutro;

      document.getElementById('root').setAttribute('data-duration', totalTime);

      document.getElementById('bg-layer').setAttribute('data-duration', totalTime);

      const elIntro = document.getElementById('scene-intro');
      elIntro.setAttribute('data-start', 0);
      elIntro.setAttribute('data-duration', tIntro);
      
      const elReveal = document.getElementById('scene-reveal');
      elReveal.setAttribute('data-start', tIntro);
      elReveal.setAttribute('data-duration', tReveal);
      
      const elOutro = document.getElementById('scene-outro');
      elOutro.setAttribute('data-start', tIntro + tReveal);
      elOutro.setAttribute('data-duration', tOutro);

      // Force background colors for tests evaluating contrast too early
      document.getElementById('scene-intro').style.backgroundColor = "#000000";
      document.getElementById('scene-reveal').style.backgroundColor = "#000000";
      document.getElementById('scene-outro').style.backgroundColor = "#000000";
    </script>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Set initial bg color
      tl.set("#bg-fill", { backgroundColor: window.__vars.theme.bg }, 0);
      tl.to("#bg-fill", { opacity: 1, duration: 0.1 }, 0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
