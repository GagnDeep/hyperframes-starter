<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  </head>
  <body>
    <div
      id="root-card"
      data-composition-id="card"
      data-start="0"
      data-duration="12"
      data-width="1080"
      data-height="1920"
      class="clip absolute inset-0 w-full h-full flex flex-col items-center justify-center p-16"
      data-track-index="0"
    >
      <div
        id="card-container"
        class="clip relative w-full max-w-[800px] rounded-3xl p-12 shadow-2xl flex flex-col gap-8 opacity-0"
        data-start="0"
        data-duration="12"
        data-track-index="1"
      >
        <!-- Badge -->
        <div id="badge-container" class="clip w-full flex items-center justify-center opacity-0" data-start="0" data-duration="12" data-track-index="2">
          <span id="badge" class="px-6 py-2 rounded-full text-3xl font-bold tracking-wider text-center uppercase border-2"></span>
        </div>

        <!-- Fact Text -->
        <div id="fact-container" class="clip w-full opacity-0" data-start="0" data-duration="12" data-track-index="3">
          <h1 id="fact" class="text-6xl leading-tight font-medium text-center text-white"></h1>
        </div>

        <!-- Divider -->
        <div id="divider-container" class="clip w-full flex justify-center opacity-0" data-start="0" data-duration="12" data-track-index="4">
          <div id="divider" class="h-1 w-32 rounded-full"></div>
        </div>

        <!-- Source -->
        <div id="source-container" class="clip w-full opacity-0" data-start="0" data-duration="12" data-track-index="5">
          <p id="source" class="text-2xl text-center font-light tracking-wide text-white"></p>
        </div>
      </div>
    </div>

    <script>
      const vars = window.__vars || {
        theme: {
          backgroundColor: "#0f172a",
          cardColor: "#1e293b",
          accentColor: "#facc15",
          accentTextColor: "#facc15",
          textColor: "#f8fafc",
          mutedTextColor: "#94a3b8",
          fontFamily: "system-ui, sans-serif"
        },
        content: {
          badge: "DID YOU KNOW?",
          fact: "Honey never spoils.",
          source: "Source: Smithsonian Institution"
        },
        timing: {
          duration: 12
        }
      };

      // Apply variables to elements
      document.body.style.fontFamily = vars.theme.fontFamily;

      const card = document.getElementById('card-container');
      if (card) card.style.backgroundColor = vars.theme.cardColor;

      const badge = document.getElementById('badge');
      if (badge) {
        badge.textContent = vars.content.badge;
        badge.style.color = vars.theme.accentColor;
        badge.style.borderColor = vars.theme.accentColor;
      }

      const fact = document.getElementById('fact');
      if (fact) {
        fact.textContent = vars.content.fact;
        fact.style.color = vars.theme.textColor;
      }

      const divider = document.getElementById('divider');
      if (divider) divider.style.backgroundColor = vars.theme.accentColor;

      const sourceText = document.getElementById('source');
      if (sourceText) {
        sourceText.textContent = vars.content.source;
        sourceText.style.color = vars.theme.mutedTextColor;
      }

      const duration = vars.timing.duration;
      const rootCard = document.getElementById('root-card');
      if (rootCard) rootCard.setAttribute('data-duration', duration);
      if (card) card.setAttribute('data-duration', duration);

      const badgeContainer = document.getElementById('badge-container');
      if (badgeContainer) badgeContainer.setAttribute('data-duration', duration);

      const factContainer = document.getElementById('fact-container');
      if (factContainer) factContainer.setAttribute('data-duration', duration);

      const dividerContainer = document.getElementById('divider-container');
      if (dividerContainer) dividerContainer.setAttribute('data-duration', duration);

      const sourceContainer = document.getElementById('source-container');
      if (sourceContainer) sourceContainer.setAttribute('data-duration', duration);


      // Setup Animation Timeline
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Reusable animation utility functions
      const fadeInUp = (selector, startAt, yOffset = 50, dur = 1) => {
        tl.fromTo(selector,
          { y: yOffset, autoAlpha: 0 },
          { y: 0, autoAlpha: 1, duration: dur, ease: "power3.out", overwrite: "auto" },
          startAt
        );
      };

      const scaleIn = (selector, startAt, dur = 0.8) => {
        tl.fromTo(selector,
          { scaleX: 0, autoAlpha: 0 },
          { scaleX: 1, autoAlpha: 1, duration: dur, ease: "power3.out" },
          startAt
        );
      };

      const popIn = (selector, startAt, yOffset = 50, dur = 0.8) => {
        tl.fromTo(selector,
          { y: yOffset, autoAlpha: 0 },
          { y: 0, autoAlpha: 1, duration: dur, ease: "back.out(1.7)" },
          startAt
        );
      };

      // Apply reusable animations
      fadeInUp("#card-container", 0, 100);
      popIn("#badge-container", 0.5);
      fadeInUp("#fact-container", 1);
      scaleIn("#divider-container", 1.5);
      fadeInUp("#source-container", 2, 20);

      // Animate out at the end
      const outStart = duration - 1;
      tl.to("#card-container", { autoAlpha: 0, y: -100, duration: 1, ease: "power3.in", overwrite: "auto" }, outStart);
      tl.set("#card-container", { autoAlpha: 0 }, duration); // Fix for missing hard kill

      window.__timelines["card"] = tl;
    </script>
  </body>
</html>
