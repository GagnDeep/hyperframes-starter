<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <script src="data.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
        font-family: sans-serif;
      }
    </style>
    <script>
      window.__vars = {
        title: "The Future of AI Coding",
        subtitle: "HyperFrames Engineering",
        backgroundColor: "#0d0d0d",
        waveformColor: "#4f46e5",
        captionColorInactive: "rgba(255,255,255,0.4)",
        captionColorActive: "#ffffff",
        brandLogo: "assets/placeholder-logo.png",
        duration: window.AUDIO_DATA.duration // duration matches audio length
      };
      document.documentElement.style.background = window.__vars.backgroundColor;
    </script>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8.6"
      data-width="1080"
      data-height="1920"
      class="relative w-[1080px] h-[1920px] overflow-hidden"
    >
      <audio id="main-audio" src="narration.wav" data-start="0" data-duration="8.6" data-track-index="0" data-volume="1"></audio>

      <!-- Branding / Top Section -->
      <div id="hero-container" class="clip absolute top-0 left-0 w-full h-[400px] flex flex-col items-center justify-center pt-20" data-start="0" data-duration="8.6" data-track-index="1">
        <img id="brand-logo" src="" alt="Logo" class="w-[150px] h-[150px] rounded-2xl mb-8" />
        <h1 id="hero-title" class="text-white text-5xl font-bold tracking-tight mb-4 text-center px-12"></h1>
        <h2 id="hero-subtitle" class="text-indigo-400 text-3xl font-medium tracking-widest uppercase"></h2>
      </div>

      <!-- Waveform Module -->
      <div
        id="comp-waveform"
        class="clip absolute top-[700px] left-0 w-full flex justify-center"
        data-composition-id="waveform"
        data-composition-src="compositions/waveform.html"
        data-start="0"
        data-duration="8.6"
        data-track-index="2"
      ></div>

      <!-- Captions Module -->
      <div
        id="comp-captions"
        class="clip absolute top-[1300px] left-0 w-full flex justify-center"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="8.6"
        data-track-index="3"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;

      // Init variables
      document.getElementById('root').setAttribute('data-duration', window.__vars.duration);
      document.getElementById('main-audio').setAttribute('data-duration', window.__vars.duration);
      document.querySelectorAll('.clip').forEach(el => el.setAttribute('data-duration', window.__vars.duration));

      document.getElementById('brand-logo').src = window.__vars.brandLogo;
      document.getElementById('hero-title').textContent = window.__vars.title;
      document.getElementById('hero-subtitle').textContent = window.__vars.subtitle;

      // Entrance Animations
      tl.from("#brand-logo", { opacity: 0, y: -20, duration: 1, ease: "power2.out" }, 0.5);
      tl.from("#hero-title", { opacity: 0, y: 20, duration: 1, ease: "power2.out" }, 0.7);
      tl.from("#hero-subtitle", { opacity: 0, y: 20, duration: 1, ease: "power2.out" }, 0.9);
    </script>
  </body>
</html>
