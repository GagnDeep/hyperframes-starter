<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"accentColor","type":"color","label":"Accent Color","default":"#3b82f6"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=800, height=1400" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.2.4/dist/index.global.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        width: 800px;
        height: 1400px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="app-screen"
      data-width="800"
      data-height="1400"
      class="flex flex-col gap-8 p-10 w-full h-full bg-white"
    >
      <!-- Hero Element -->
      <div id="skel-hero" class="clip w-full h-80 rounded-3xl" data-start="0" data-duration="15" data-track-index="1"></div>

      <!-- Text Blocks -->
      <div id="skel-text-1" class="clip w-full h-12 bg-slate-400 rounded-xl" data-start="0" data-duration="15" data-track-index="2"></div>
      <div id="skel-text-2" class="clip w-4/5 h-12 bg-slate-400 rounded-xl" data-start="0" data-duration="15" data-track-index="3"></div>

      <!-- Grid -->
      <div class="flex gap-6 mt-4">
        <div id="skel-card-1" class="clip flex-1 h-64 bg-slate-300 rounded-2xl" data-start="0" data-duration="15" data-track-index="4"></div>
        <div id="skel-card-2" class="clip flex-1 h-64 bg-slate-300 rounded-2xl" data-start="0" data-duration="15" data-track-index="5"></div>
      </div>
    </div>

    <script>
      (() => {
        const { accentColor } = window.__hyperframes.getVariables();

        document.getElementById("skel-hero").style.backgroundColor = accentColor;

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Stagger UI elements inside
        tl.fromTo("#root > div, #root > .flex > div", {
          y: 60,
          opacity: 0
        }, {
          y: 0,
          opacity: 1,
          duration: 0.8,
          stagger: 0.15,
          ease: "power2.out"
        }, 0);

        window.__timelines["app-screen"] = tl;
      })();
    </script>
  </body>
</html>
