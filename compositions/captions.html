<div
  id="captions-root"
  class="w-full h-full flex flex-col items-center justify-center relative z-50"
  data-composition-id="captions"
  data-width="1080"
  data-height="1920"
  data-start="0"
  data-duration="10"
>
  <div id="captions-container" class="relative w-full px-12 flex justify-center items-center h-[300px]">
    <!-- Captions dynamically injected here -->
  </div>
</div>

<script>
  window.__timelines = window.__timelines || {};
  const tlCaps = gsap.timeline({ paused: true });

  const container = document.getElementById("captions-container");
  const caps = window.__vars.captions || [];

  caps.forEach((cap, i) => {
    const id = `cap-${i}`;
    const el = document.createElement("div");
    el.id = id;
    el.className = "clip absolute text-center font-bold uppercase drop-shadow-2xl";
    el.style.fontSize = "110px";
    el.style.lineHeight = "1.1";
    el.style.color = window.__vars.textColor;

    // Split text into words for stagger effect
    const words = cap.text.split(" ").map(w => `<span class="inline-block px-2 ${id}-word">${w}</span>`).join("");
    el.innerHTML = words;

    // Set HyperFrames clip attributes
    el.setAttribute("data-start", cap.start);
    el.setAttribute("data-duration", cap.end - cap.start);
    el.setAttribute("data-track-index", "2");

    container.appendChild(el);

    // Animation: Bouncy entrance for each word
    tlCaps.fromTo(
      `.${id}-word`,
      { scale: 0.2, opacity: 0, y: 50 },
      {
        scale: 1,
        opacity: 1,
        y: 0,
        duration: 0.4,
        stagger: 0.1,
        ease: "back.out(1.7)"
      },
      cap.start
    );

    // Subtle float during visibility
    tlCaps.to(`.${id}-word`, {
      y: -10,
      duration: (cap.end - cap.start) - 0.4 - 0.2,
      ease: "power1.inOut",
      yoyo: true,
      repeat: 1
    }, cap.start + 0.4);

    // Exit animation: quick scale down
    const exitTime = cap.end - 0.2;
    tlCaps.to(`.${id}-word`, {
        scale: 0.8,
        opacity: 0,
        y: -30,
        duration: 0.2,
        ease: "power2.in"
    }, exitTime);

    // Deterministic kill step to ensure it doesn't flicker later
    tlCaps.set(el, { opacity: 0, visibility: 'hidden' }, cap.end);
  });

  window.__timelines["captions"] = tlCaps;
</script>
