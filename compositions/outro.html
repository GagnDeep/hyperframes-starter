<template id="outro-template">
  <div data-composition-id="outro" data-width="1080" data-height="1920">
    <div class="flex flex-col justify-center items-center w-full h-full px-[80px] py-[120px] box-border text-center scene-wrapper bg-[#111111]">
      <div class="text-[80px] font-[800] mb-[60px]" id="o-text"></div>
      <div class="px-[100px] py-[40px] rounded-[100px] text-[64px] font-[800] tracking-[2px]" id="o-cta"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const v = window.__vars;

      // Populate elements
      document.getElementById('o-text').textContent = v.content.outroText;
      document.getElementById('o-text').style.color = v.theme.textMain;

      const cta = document.getElementById('o-cta');
      cta.textContent = v.content.outroCta;
      cta.style.backgroundColor = "transparent";
      cta.style.color = v.theme.textMain;

      // Additional explicit styling to prevent bugs in parsing logic for validation
      cta.style.border = `4px solid ${v.theme.textMain}`;

      // Animation
      tl.from("#o-text", {
        y: 50,
        opacity: 0,
        duration: 0.8,
        ease: "power3.out"
      }, 0.3);

      tl.from("#o-cta", {
        scale: 0.9,
        y: 40,
        opacity: 0,
        duration: 0.8,
        ease: "expo.out"
      }, 0.6);

      // Only final scene is allowed to have exit animations (to black)
      // Outro ends fading out to background
      tl.to(".scene-wrapper", {
        opacity: 0,
        duration: 0.5,
        ease: "power2.inOut"
      }, v.timing.outroDuration - 0.5);

      window.__timelines["outro"] = tl;
    </script>
  </div>
</template>
